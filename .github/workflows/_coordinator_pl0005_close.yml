name: PackLab Coordinator Close PL-0005

on:
  push:
    paths:
      - '.github/workflows/_coordinator_pl0005_close.yml'

permissions:
  contents: write

jobs:
  update-task-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update canonical H!veAI task state
        shell: python
        run: |
          from pathlib import Path
          p = Path('TASKS.md')
          s = p.read_text(encoding='utf-8')
          replacements = {
              '- Current Task: PL-0005 — Create dependency/license register for NextLevel, COLMAP, OpenMVS, Open3D, OpenCV, PyTorch, OpenCascade bindings, Blender and PySide6.': '- Current Task: PL-0006 — Define semantic versioning rules for PackLab Studio, PackLab Capture and PackScan schema.',
              '- Current Task Status: CHANGES_REQUIRED': '- Current Task Status: READY',
              '- Next Task/Action: Execute `coordination/sessions/PL-0005-C001/CODEX_PROMPT_V02.md` with `CHATGPT_AUDIT_CRITERIA_V02.md`, then return `AWAITING_AUDIT` for independent ChatGPT re-audit.': '- Next Task/Action: Execute `coordination/sessions/PL-0006-C001/CODEX_PROMPT_V01.md` with its matching audit criteria, then return `AWAITING_AUDIT` for independent ChatGPT audit.',
              '- [ ] **PL-0005** Create dependency/license register for NextLevel, COLMAP, OpenMVS, Open3D, OpenCV, PyTorch, OpenCascade bindings, Blender and PySide6.': '- [x] **PL-0005** Create dependency/license register for NextLevel, COLMAP, OpenMVS, Open3D, OpenCV, PyTorch, OpenCascade bindings, Blender and PySide6.'
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Expected tracker text not found: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8', newline='\n')
      - name: Commit tracker update
        run: |
          git config user.name "PackLab ChatGPT Coordinator"
          git config user.email "actions@users.noreply.github.com"
          git add TASKS.md
          git diff --cached --check
          git commit -m "tracker(PL-0005): close audited task and advance to PL-0006"
          git push origin HEAD:main
