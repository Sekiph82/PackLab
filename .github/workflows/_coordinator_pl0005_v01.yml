name: PackLab Coordinator PL-0005 V01 State Update

on:
  push:
    paths:
      - '.github/workflows/_coordinator_pl0005_v01.yml'

permissions:
  contents: write

jobs:
  update-task-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update canonical H!veAI task state
        shell: python
        run: |
          from pathlib import Path
          p = Path('TASKS.md')
          s = p.read_text(encoding='utf-8')
          old_status = '- Current Task Status: READY'
          old_next = '- Next Task/Action: Execute `coordination/sessions/PL-0005-C001/CODEX_PROMPT_V01.md` with its matching audit criteria, then return `AWAITING_AUDIT` for independent ChatGPT audit.'
          new_status = '- Current Task Status: CHANGES_REQUIRED'
          new_next = '- Next Task/Action: Execute `coordination/sessions/PL-0005-C001/CODEX_PROMPT_V02.md` with `CHATGPT_AUDIT_CRITERIA_V02.md`, then return `AWAITING_AUDIT` for independent ChatGPT re-audit.'
          if old_status not in s:
              raise SystemExit('Expected READY status not found')
          if old_next not in s:
              raise SystemExit('Expected V01 next-action line not found')
          s = s.replace(old_status, new_status, 1).replace(old_next, new_next, 1)
          p.write_text(s, encoding='utf-8', newline='\n')
      - name: Commit tracker update
        run: |
          git config user.name "PackLab ChatGPT Coordinator"
          git config user.email "actions@users.noreply.github.com"
          git add TASKS.md
          git diff --cached --check
          git commit -m "tracker(PL-0005): mark V01 changes required" 
          git push origin HEAD:main
