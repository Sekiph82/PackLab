name: PackLab Signing Material Guard

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signing-material-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signing-material-guard:
    name: Scan tracked repository for signing material
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Guard tracked Apple signing material and secret assignments
        run: python -m tools.ci.ci_data_safety --repository "$GITHUB_WORKSPACE" --check-signing-secrets
