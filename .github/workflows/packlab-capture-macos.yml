name: PackLab Capture macOS CI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/packlab-capture-macos.yml'
      - 'apps/ios-capture/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/packlab-capture-macos.yml'
      - 'apps/ios-capture/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-tests:
    name: Unsigned iOS Simulator build and XCTest
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      PROJECT: apps/ios-capture/PackLabCapture.xcodeproj
      SCHEME: PackLabCapture
      DESTINATION: platform=iOS Simulator,name=iPhone 16,OS=18.5

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Select Xcode and record runner provenance
        run: |
          set -euo pipefail
          test -d /Applications/Xcode_16.4.app
          sudo xcode-select --switch /Applications/Xcode_16.4.app
          {
            echo '## Runner provenance'
            echo
            echo "- Runner image: macos-15"
            echo "- Xcode: $(xcodebuild -version | tr '\n' ' ')"
            echo "- macOS: $(sw_vers -productVersion)"
            echo "- iOS Simulator SDK: $(xcrun --sdk iphonesimulator --show-sdk-version)"
            echo "- Simulator destination: $DESTINATION"
            echo "- Signing: disabled (CODE_SIGNING_ALLOWED=NO, CODE_SIGNING_REQUIRED=NO, empty CODE_SIGN_IDENTITY)"
            echo "- Source revision: $GITHUB_SHA"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Build PackLabCapture for iOS Simulator without signing
        run: |
          set -euo pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/packlab-capture-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee "$RUNNER_TEMP/packlab-capture-build.log"
          echo '- Simulator app build: PASS' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run PackLabCaptureTests on iOS Simulator without signing
        run: |
          set -euo pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/packlab-capture-derived-data" \
            -resultBundlePath "$RUNNER_TEMP/PackLabCapture.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee "$RUNNER_TEMP/packlab-capture-test.log"

      - name: Verify and record XCTest summary
        if: always()
        run: |
          set -euo pipefail
          if [[ ! -d "$RUNNER_TEMP/PackLabCapture.xcresult" ]]; then
            echo 'XCTest result bundle is missing.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          summary="$(xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/PackLabCapture.xcresult" --format json)"
          safe_summary="$(printf '%s' "$summary" | jq '{result, totalTestCount, passedTests, failedTests, skippedTests}')"
          printf '\n## XCTest summary\n\n```json\n%s\n```\n' "$safe_summary" | tee -a "$GITHUB_STEP_SUMMARY"
          result="$(printf '%s' "$safe_summary" | jq -r '.result // "Unknown"')"
          total="$(printf '%s' "$safe_summary" | jq -r '.totalTestCount // 0')"
          failed="$(printf '%s' "$safe_summary" | jq -r '.failedTests // 0')"
          if [[ "$result" != "Passed" || "$total" -lt 1 || "$failed" -ne 0 ]]; then
            echo "XCTest did not pass with at least one executed test (result=$result, total=$total, failed=$failed)." >&2
            exit 1
          fi
