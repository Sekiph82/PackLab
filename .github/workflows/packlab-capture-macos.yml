name: PackLab Capture macOS CI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/packlab-capture-macos.yml'
      - 'apps/ios-capture/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/packlab-capture-macos.yml'
      - 'apps/ios-capture/**'
  workflow_dispatch:
    inputs:
      focused_group:
        description: Run all 205 tests or one bounded recovery family
        type: choice
        required: true
        default: all
        options:
          - all
          - recovery_all
          - pl0119_finalization_failures
          - session_integrity
          - camera_pose
          - capture_coverage
          - preflight_transfer

permissions:
  contents: read

jobs:
  capture-tests:
    name: Unsigned iOS Simulator build and XCTest
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      PROJECT: apps/ios-capture/PackLabCapture.xcodeproj
      SCHEME: PackLabCapture
      DESTINATION: platform=iOS Simulator,name=iPhone 16,OS=18.0
      FOCUSED_GROUP: ${{ inputs.focused_group || 'all' }}

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Select Xcode and record runner provenance
        run: |
          set -euo pipefail
          test -d /Applications/Xcode_16.app
          sudo xcode-select --switch /Applications/Xcode_16.app
          {
            echo '## Runner provenance'
            echo
            echo "- Runner image: macos-15"
            echo "- Xcode: $(xcodebuild -version | tr '\n' ' ')"
            echo "- macOS: $(sw_vers -productVersion)"
            echo "- iOS Simulator SDK: $(xcrun --sdk iphonesimulator --show-sdk-version)"
            echo "- Simulator destination: $DESTINATION"
            echo "- Signing: disabled (CODE_SIGNING_ALLOWED=NO, CODE_SIGNING_REQUIRED=NO, empty CODE_SIGN_IDENTITY)"
            echo "- Source revision: $GITHUB_SHA"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Ensure iOS 18.0 Simulator runtime is installed
        run: |
          set -euo pipefail
          if ! xcrun simctl list runtimes --json | jq -e '.runtimes[] | select(.identifier == "com.apple.CoreSimulator.SimRuntime.iOS-18-0" and .isAvailable)' >/dev/null; then
            runtime_dir="$RUNNER_TEMP/ios-18.0-simulator-runtime"
            mkdir -p "$runtime_dir"
            xcodebuild -downloadPlatform iOS -exportPath "$runtime_dir"
            runtime_image="$(find "$runtime_dir" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
            test -n "$runtime_image"
            xcodebuild -importPlatform "$runtime_image"
          fi
          xcrun simctl list runtimes --json | jq -e '.runtimes[] | select(.identifier == "com.apple.CoreSimulator.SimRuntime.iOS-18-0" and .isAvailable)' >/dev/null
          xcodebuild -showdestinations -project "$PROJECT" -scheme "$SCHEME" | grep -F 'iPhone 16' | grep -F '18.0'

      - name: Resolve pinned NextLevel and preserve its Swift 5 source compatibility
        run: |
          set -euo pipefail
          derived_data="$RUNNER_TEMP/packlab-capture-derived-data"
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -derivedDataPath "$derived_data"
          package_manifest="$derived_data/SourcePackages/checkouts/NextLevel/Package.swift"
          test -f "$package_manifest"
          chmod u+w "$package_manifest"
          python3 - "$package_manifest" <<'PY'
          from pathlib import Path
          import sys

          manifest_path = Path(sys.argv[1])
          manifest = manifest_path.read_text()
          expected = [
              '// swift-tools-version:6.0',
              '.enableUpcomingFeature("ExistentialAny")',
              'swiftLanguageModes: [.version("6")]',
          ]
          if any(manifest.count(value) != 1 for value in expected):
              raise SystemExit('Resolved NextLevel manifest differs from the reviewed 0.19.1 compatibility boundary.')
          manifest = manifest.replace('              .enableUpcomingFeature("ExistentialAny")\n', '')
          manifest = manifest.replace('swiftLanguageModes: [.version("6")]', 'swiftLanguageModes: [.version("5")]')
          manifest_path.write_text(manifest)
          if '.enableUpcomingFeature("ExistentialAny")' in manifest or 'swiftLanguageModes: [.version("5")]' not in manifest:
              raise SystemExit('Could not apply the scoped NextLevel Swift 5 compatibility adjustment.')
          print('NextLevel source version: 0.19.1 (resolved from the exact Xcode project pin)')
          print('Runner-local package language mode: Swift 5; dependency source files remain unchanged')
          PY

      - name: Build PackLabCapture for iOS Simulator without signing
        run: |
          set -euo pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/packlab-capture-derived-data" \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee "$RUNNER_TEMP/packlab-capture-build.log"
          echo '- Simulator app build: PASS' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run PackLabCaptureTests on iOS Simulator without signing
        id: run-xctests
        run: |
          set -euo pipefail
          names=()
          case "$FOCUSED_GROUP" in
            all) ;;
            recovery_all)
              names=(testAuthoritativeDeletionRemovesSessionAndRejectsTraversal testDeletionPlanRequiresConfirmationAndStaysInsideRoot testFinalizationGateDistinguishesBindingAndChecksumFailures testPL0088EveryTransactionFailureStageRecoversCleanPreCaptureState testPL0089RetakeCallbackAndDeleteRetakeFailureStagesRollbackCoherently testPL0090DiscoveryUsesRecoveredStateBlocksCorruptionAndDiscardsOnlyResumableSessions testSessionDiscoveryReconstructsHistoryAndBlocksMissingOrVersionMismatch testPL0073FocusCannotLockBeforeObservedStabilization testPL0080AndPL0081AcceptedStillOrchestrationPersistsPoseMotionAndReopens testPL0083AndPL0085RuntimeRefreshUsesInjectedServicesAndStops testPL0085OverlayPropagatesNewestPoseMotionAndEpochThenStops testPoseClockBridgeBindsAcceptedStillAndExactBoundaries testPL0095CandidateRuntimePublishesAlignedMotionWarningsAndHighRisk testPL0097CandidateRuntimePublishesShadowBandsAndRawObjectFraction testPL0102CoverageUsesExactElevationBoundariesAndAdjacentValuesDeterministically testPL0104ProductionAutoCaptureUsesHealthGatedBackendAndAcceptedTransaction testPL0104ProductionGateMatrixNeverInvokesBackendWhenBlocked testPL0105DuplicateDetectorProvesTranslationElevationAndSignatureBoundaries testPL0106RingAndSectorBoundariesAreDeterministicInLiveGuidance testPL0109ActiveCompletionPropagatesAndPersistsWithOptionalBaseState testPL0109CompletionDiagnosticsDistinguishesCompleteAndUnavailableEvidence testPL0118PreflightIsTableDrivenAcrossPresetsAndHealthConditions testPL0120ProductionSharePresentationStateCoversCancelCompletionFailureAndReplacement testPL0120ShareEligibilityRejectsMissingOrNonPackscanFiles testPL0121SwiftWireModelsMatchSharedGoldenFields)
              ;;
            pl0119_finalization_failures)
              names=(testPL0119InjectedFinalizationFailuresLeaveNoPartialArtifactsAndPreservePriorExport)
              ;;
            session_integrity)
              names=(testAuthoritativeDeletionRemovesSessionAndRejectsTraversal testDeletionPlanRequiresConfirmationAndStaysInsideRoot testFinalizationGateDistinguishesBindingAndChecksumFailures testPL0088EveryTransactionFailureStageRecoversCleanPreCaptureState testPL0089RetakeCallbackAndDeleteRetakeFailureStagesRollbackCoherently testPL0090DiscoveryUsesRecoveredStateBlocksCorruptionAndDiscardsOnlyResumableSessions testSessionDiscoveryReconstructsHistoryAndBlocksMissingOrVersionMismatch)
              ;;
            camera_pose)
              names=(testPL0073FocusCannotLockBeforeObservedStabilization testPL0080AndPL0081AcceptedStillOrchestrationPersistsPoseMotionAndReopens testPL0083AndPL0085RuntimeRefreshUsesInjectedServicesAndStops testPL0085OverlayPropagatesNewestPoseMotionAndEpochThenStops testPoseClockBridgeBindsAcceptedStillAndExactBoundaries)
              ;;
            capture_coverage)
              names=(testPL0095CandidateRuntimePublishesAlignedMotionWarningsAndHighRisk testPL0097CandidateRuntimePublishesShadowBandsAndRawObjectFraction testPL0102CoverageUsesExactElevationBoundariesAndAdjacentValuesDeterministically testPL0104ProductionAutoCaptureUsesHealthGatedBackendAndAcceptedTransaction testPL0104ProductionGateMatrixNeverInvokesBackendWhenBlocked testPL0105DuplicateDetectorProvesTranslationElevationAndSignatureBoundaries testPL0106RingAndSectorBoundariesAreDeterministicInLiveGuidance testPL0109ActiveCompletionPropagatesAndPersistsWithOptionalBaseState testPL0109CompletionDiagnosticsDistinguishesCompleteAndUnavailableEvidence)
              ;;
            preflight_transfer)
              names=(testPL0118PreflightIsTableDrivenAcrossPresetsAndHealthConditions testPL0120ProductionSharePresentationStateCoversCancelCompletionFailureAndReplacement testPL0120ShareEligibilityRejectsMissingOrNonPackscanFiles testPL0121SwiftWireModelsMatchSharedGoldenFields)
              ;;
            *) echo "Unknown focused group: $FOCUSED_GROUP" >&2; exit 2 ;;
          esac
          echo "- XCTest selection: $FOCUSED_GROUP" | tee -a "$GITHUB_STEP_SUMMARY"
          xcodebuild_args=(
            -project "$PROJECT"
            -scheme "$SCHEME"
            -destination "$DESTINATION"
            -derivedDataPath "$RUNNER_TEMP/packlab-capture-derived-data"
            -resultBundlePath "$RUNNER_TEMP/PackLabCapture.xcresult"
            ONLY_ACTIVE_ARCH=YES
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
            CODE_SIGN_IDENTITY=""
          )
          if [[ "$FOCUSED_GROUP" != all ]]; then
            for name in "${names[@]}"; do
              xcodebuild_args+=("-only-testing:PackLabCaptureTests/PackLabCaptureTests/$name")
            done
          fi
          xcodebuild test "${xcodebuild_args[@]}" \
            | tee "$RUNNER_TEMP/packlab-capture-test.log"

      - name: Verify and record XCTest summary
        if: always()
        run: |
          set -euo pipefail
          if [[ ! -d "$RUNNER_TEMP/PackLabCapture.xcresult" ]]; then
            echo 'XCTest result bundle is missing.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          summary="$(xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/PackLabCapture.xcresult" --format json)"
          safe_summary="$(printf '%s' "$summary" | jq '{result, totalTestCount, passedTests, failedTests, skippedTests}')"
          printf '\n## XCTest summary\n\n```json\n%s\n```\n' "$safe_summary" | tee -a "$GITHUB_STEP_SUMMARY"
          result="$(printf '%s' "$safe_summary" | jq -r '.result // "Unknown"')"
          total="$(printf '%s' "$safe_summary" | jq -r '.totalTestCount // 0')"
          failed="$(printf '%s' "$safe_summary" | jq -r '.failedTests // 0')"
          skipped="$(printf '%s' "$safe_summary" | jq -r '.skippedTests // 0')"
          case "$FOCUSED_GROUP" in
            all) expected=205 ;;
            recovery_all) expected=25 ;;
            pl0119_finalization_failures) expected=1 ;;
            session_integrity) expected=7 ;;
            camera_pose) expected=5 ;;
            capture_coverage) expected=9 ;;
            preflight_transfer) expected=4 ;;
            *) echo "Unknown focused group in result verification: $FOCUSED_GROUP" >&2; exit 2 ;;
          esac
          if [[ "$result" != "Passed" || "$total" -ne "$expected" || "$failed" -ne 0 || "$skipped" -ne 0 ]]; then
            echo "XCTest selection did not pass with its expected count (group=$FOCUSED_GROUP, result=$result, total=$total, expected=$expected, failed=$failed, skipped=$skipped)." >&2
            exit 1
          fi

      - name: Preserve failed XCTest diagnostics for one day
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: packlab-capture-xcresult-${{ github.run_id }}
          path: ${{ runner.temp }}/PackLabCapture.xcresult
          if-no-files-found: ignore
          retention-days: 1
