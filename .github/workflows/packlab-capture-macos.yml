name: PackLab Capture macOS CI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/packlab-capture-macos.yml'
      - 'apps/ios-capture/**'
      - 'schemas/packscan/**'
      - 'tests/fixtures/packscan/**'
      - 'docs/packscan/**'
      - 'tools/ci/ios_artifact_provenance.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/packlab-capture-macos.yml'
      - 'apps/ios-capture/**'
      - 'schemas/packscan/**'
      - 'tests/fixtures/packscan/**'
      - 'docs/packscan/**'
      - 'tools/ci/ios_artifact_provenance.py'
  workflow_dispatch:
    inputs:
      focused_group:
        description: Run all 205 tests or one bounded recovery family
        type: choice
        required: true
        default: all
        options:
          - all
          - recovery_all
          - pl0119_finalization_failures
          - session_integrity
          - camera_pose
          - capture_coverage
          - preflight_transfer

permissions:
  contents: read

jobs:
  capture-unsigned-device-archive:
    name: Unsigned iOS device archive
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      PROJECT: apps/ios-capture/PackLabCapture.xcodeproj
      SCHEME: PackLabCapture

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Select Xcode and record archive toolchain
        id: archive-xcode
        run: |
          set -euo pipefail
          test -d /Applications/Xcode_16.app
          sudo xcode-select --switch /Applications/Xcode_16.app
          xcode_version="$(xcodebuild -version | awk '/^Xcode / { print $2 }')"
          xcode_build="$(xcodebuild -version | awk '/^Build version / { print $3 }')"
          ios_sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          test -n "$xcode_version"
          test -n "$xcode_build"
          test -n "$ios_sdk"
          echo "version=$xcode_version" >> "$GITHUB_OUTPUT"
          echo "build=$xcode_build" >> "$GITHUB_OUTPUT"
          echo "ios_sdk=$ios_sdk" >> "$GITHUB_OUTPUT"
          {
            echo '## Unsigned device archive toolchain'
            echo
            echo "- Runner image: macos-15"
            echo "- macOS: $(sw_vers -productVersion)"
            echo "- Xcode: $(xcodebuild -version | tr '\n' ' ')"
            echo "- iOS SDK: $ios_sdk"
            echo '- Destination: generic/platform=iOS'
            echo '- Signing: disabled; no Apple developer credentials are read'
            echo "- Source revision: $GITHUB_SHA"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Restore exact Swift Package Manager cache
        id: archive-spm-cache
        if: ${{ hashFiles('apps/ios-capture/PackLabCapture.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') != '' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/packlab-capture-archive-derived-data/SourcePackages/repositories
            ~/Library/Caches/org.swift.swiftpm
          key: packlab-spm-${{ runner.os }}-${{ runner.arch }}-macos-15-xcode-${{ steps.archive-xcode.outputs.version }}-${{ steps.archive-xcode.outputs.build }}-${{ hashFiles('apps/ios-capture/PackLabCapture.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Resolve and validate the exact NextLevel package pin
        run: |
          set -euo pipefail
          derived_data="$RUNNER_TEMP/packlab-capture-archive-derived-data"
          package_resolved='apps/ios-capture/PackLabCapture.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved'
          project_file='apps/ios-capture/PackLabCapture.xcodeproj/project.pbxproj'
          test -s "$package_resolved"
          before_digest="$(shasum -a 256 "$package_resolved" | awk '{ print $1 }')"
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -derivedDataPath "$derived_data"
          after_digest="$(shasum -a 256 "$package_resolved" | awk '{ print $1 }')"
          test "$before_digest" = "$after_digest"
          python3 - "$package_resolved" "$project_file" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          lock = json.loads(Path(sys.argv[1]).read_text())
          project = Path(sys.argv[2]).read_text()
          exact_pin = re.compile(
              r'repositoryURL = "https://github[.]com/NextLevel/NextLevel";\s*'
              r'requirement = [{]kind = exactVersion; version = 0[.]19[.]1; [}];'
          )
          pins = lock.get('pins')
          if len(exact_pin.findall(project)) != 1 or not isinstance(pins, list) or len(pins) != 1:
              raise SystemExit('Expected the reviewed single exact NextLevel 0.19.1 dependency.')
          pin = pins[0]
          state = pin.get('state', {})
          if (
              pin.get('identity', '').casefold() != 'nextlevel'
              or state.get('version') != '0.19.1'
              or not re.fullmatch(r'[0-9a-f]{40}', state.get('revision', ''))
          ):
              raise SystemExit('Package.resolved differs from the reviewed NextLevel 0.19.1 revision pin.')
          print(f"NextLevel pin: 0.19.1 at {state['revision']}")
          PY
          package_manifest="$derived_data/SourcePackages/checkouts/NextLevel/Package.swift"
          test -f "$package_manifest"
          chmod u+w "$package_manifest"
          python3 - "$package_manifest" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          manifest = path.read_text()
          expected = [
              '// swift-tools-version:6.0',
              '.enableUpcomingFeature("ExistentialAny")',
              'swiftLanguageModes: [.version("6")]',
          ]
          if any(manifest.count(value) != 1 for value in expected):
              raise SystemExit('Resolved NextLevel manifest differs from the reviewed 0.19.1 compatibility boundary.')
          manifest = manifest.replace('              .enableUpcomingFeature("ExistentialAny")\n', '')
          manifest = manifest.replace('swiftLanguageModes: [.version("6")]', 'swiftLanguageModes: [.version("5")]')
          path.write_text(manifest)
          if '.enableUpcomingFeature("ExistentialAny")' in manifest or 'swiftLanguageModes: [.version("5")]' not in manifest:
              raise SystemExit('Could not apply the runner-local NextLevel Swift 5 compatibility adjustment.')
          print('Applied runner-local Swift 5 compatibility adjustment to NextLevel 0.19.1 manifest only.')
          PY
          echo "- Package.resolved SHA-256: $after_digest" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Archive PackLabCapture for generic iOS without signing
        run: |
          set -euo pipefail
          archive_path="$RUNNER_TEMP/PackLabCapture-unsigned.xcarchive"
          test ! -e "$archive_path"
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive_path" \
            -derivedDataPath "$RUNNER_TEMP/packlab-capture-archive-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee "$RUNNER_TEMP/packlab-capture-archive.log"
          echo '- Generic iOS archive build: PASS (unsigned; not an installable IPA)' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Validate unsigned archive contents
        run: |
          set -euo pipefail
          archive_path="$RUNNER_TEMP/PackLabCapture-unsigned.xcarchive"
          app_path="$archive_path/Products/Applications/PackLabCapture.app"
          app_info="$app_path/Info.plist"
          test -d "$archive_path"
          test -s "$archive_path/Info.plist"
          test -d "$app_path"
          test -s "$app_info"
          if find "$archive_path" \( -name embedded.mobileprovision -o -name _CodeSignature \) -print -quit | grep -q .; then
            echo 'Unsigned archive unexpectedly contains a provisioning profile or code signature.' >&2
            exit 1
          fi
          app_executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_info")"
          if [[ "$app_executable" != 'PackLabCapture' ]]; then
            echo 'Archived app executable name differs from the expected PackLabCapture product.' >&2
            exit 1
          fi
          test -s "$app_path/$app_executable"
          set +e
          signature_output="$(/usr/bin/codesign --display --verbose=4 "$app_path/$app_executable" 2>&1)"
          signature_status=$?
          set -e
          if [[ "$signature_status" -eq 0 ]]; then
            echo 'Unsigned archive unexpectedly contains a signed app executable.' >&2
            exit 1
          fi
          if [[ "$signature_output" != *'code object is not signed at all'* ]]; then
            echo 'Could not establish that the archived app executable is unsigned.' >&2
            exit 1
          fi
          python3 - "$app_info" <<'PY'
          import plistlib
          import sys
          from pathlib import Path

          info = plistlib.loads(Path(sys.argv[1]).read_bytes())
          expected = {
              'CFBundleIdentifier': 'com.packlab.capture',
              'CFBundleShortVersionString': '0.1.0',
              'CFBundleVersion': '1',
              'DTPlatformName': 'iphoneos',
          }
          for key, value in expected.items():
              if info.get(key) != value:
                  raise SystemExit(f'{key} mismatch: expected {value!r}; got {info.get(key)!r}.')
          if 'iPhoneOS' not in info.get('CFBundleSupportedPlatforms', []):
              raise SystemExit('Archived app does not declare iPhoneOS as a supported platform.')
          print('Archive app bundle, Capture version/build, and iPhoneOS platform validated.')
          PY
          bundle_identifier="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_info")"
          test "$bundle_identifier" = 'com.packlab.capture'
          echo '- Archive signing state: validated UNSIGNED; no IPA or signing material produced' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Prepare unsigned device archive provenance sidecar
        env:
          PACKLAB_ARTIFACT_TYPE: ios_device_archive
          PACKLAB_SIGNING_STATE: UNSIGNED
          PACKLAB_PRODUCT_NAME: PackLabCapture-unsigned.xcarchive
          PACKLAB_CAPTURE_VERSION: 0.1.0
          PACKLAB_CAPTURE_BUILD: '1'
          PACKLAB_PACKSCAN_SCHEMA_VERSION: 1.0.0
          PACKLAB_XCODE_VERSION: ${{ steps.archive-xcode.outputs.version }}
          PACKLAB_XCODE_BUILD: ${{ steps.archive-xcode.outputs.build }}
          PACKLAB_SDK_NAME: iphoneos
          PACKLAB_SDK_VERSION: ${{ steps.archive-xcode.outputs.ios_sdk }}
          PACKLAB_BUNDLE_IDENTIFIER: com.packlab.capture
          PACKLAB_PACKAGE_RESOLVED_SHA256: ${{ hashFiles('apps/ios-capture/PackLabCapture.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
        run: |
          set -euo pipefail
          python3 tools/ci/ios_artifact_provenance.py prepare \
            --artifact "$RUNNER_TEMP/PackLabCapture-unsigned.xcarchive" \
            --sidecar "$RUNNER_TEMP/packlab-capture-device-archive-provenance.json"

      - name: Verify unsigned device archive provenance before upload
        id: verify_device_archive_provenance
        run: |
          set -euo pipefail
          python3 tools/ci/ios_artifact_provenance.py verify \
            --artifact "$RUNNER_TEMP/PackLabCapture-unsigned.xcarchive" \
            --sidecar "$RUNNER_TEMP/packlab-capture-device-archive-provenance.json"

      - name: Preserve unsigned device archive for one day
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: packlab-capture-unsigned-device-archive-${{ github.sha }}
          path: |
            ${{ runner.temp }}/PackLabCapture-unsigned.xcarchive
            ${{ runner.temp }}/packlab-capture-device-archive-provenance.json
          if-no-files-found: error
          retention-days: 1

  capture-tests:
    name: Unsigned iOS Simulator build and XCTest
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      PROJECT: apps/ios-capture/PackLabCapture.xcodeproj
      SCHEME: PackLabCapture
      DESTINATION: platform=iOS Simulator,name=iPhone 16,OS=18.0
      FOCUSED_GROUP: ${{ inputs.focused_group || 'all' }}

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Select Xcode and record runner provenance
        id: xcode
        run: |
          set -euo pipefail
          test -d /Applications/Xcode_16.app
          sudo xcode-select --switch /Applications/Xcode_16.app
          xcode_version="$(xcodebuild -version | awk '/^Xcode / { print $2 }')"
          xcode_build="$(xcodebuild -version | awk '/^Build version / { print $3 }')"
          simulator_sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          test -n "$xcode_version"
          test -n "$xcode_build"
          echo "version=$xcode_version" >> "$GITHUB_OUTPUT"
          echo "build=$xcode_build" >> "$GITHUB_OUTPUT"
          echo "ios_simulator_sdk=$simulator_sdk" >> "$GITHUB_OUTPUT"
          {
            echo '## Runner provenance'
            echo
            echo "- Runner image: macos-15"
            echo "- Xcode: $(xcodebuild -version | tr '\n' ' ')"
            echo "- macOS: $(sw_vers -productVersion)"
            echo "- iOS Simulator SDK: $(xcrun --sdk iphonesimulator --show-sdk-version)"
            echo "- Simulator destination: $DESTINATION"
            echo "- Signing: disabled (CODE_SIGNING_ALLOWED=NO, CODE_SIGNING_REQUIRED=NO, empty CODE_SIGN_IDENTITY)"
            echo "- Source revision: $GITHUB_SHA"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Restore exact Swift Package Manager cache
        id: spm-cache
        if: ${{ hashFiles('apps/ios-capture/PackLabCapture.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') != '' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/packlab-capture-derived-data/SourcePackages/repositories
            ~/Library/Caches/org.swift.swiftpm
          key: packlab-spm-${{ runner.os }}-${{ runner.arch }}-macos-15-xcode-${{ steps.xcode.outputs.version }}-${{ steps.xcode.outputs.build }}-${{ hashFiles('apps/ios-capture/PackLabCapture.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Record Swift Package Manager cache result
        if: always()
        env:
          CACHE_HIT: ${{ steps.spm-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [[ "$CACHE_HIT" == true ]]; then
            echo '- SPM dependency cache: exact-key hit (resolution validation still runs below)' | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo '- SPM dependency cache: miss (resolution runs from declared upstream sources)' | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Ensure iOS 18.0 Simulator runtime is installed
        run: |
          set -euo pipefail
          if ! xcrun simctl list runtimes --json | jq -e '.runtimes[] | select(.identifier == "com.apple.CoreSimulator.SimRuntime.iOS-18-0" and .isAvailable)' >/dev/null; then
            runtime_dir="$RUNNER_TEMP/ios-18.0-simulator-runtime"
            mkdir -p "$runtime_dir"
            xcodebuild -downloadPlatform iOS -exportPath "$runtime_dir"
            runtime_image="$(find "$runtime_dir" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
            test -n "$runtime_image"
            xcodebuild -importPlatform "$runtime_image"
          fi
          xcrun simctl list runtimes --json | jq -e '.runtimes[] | select(.identifier == "com.apple.CoreSimulator.SimRuntime.iOS-18-0" and .isAvailable)' >/dev/null
          xcodebuild -showdestinations -project "$PROJECT" -scheme "$SCHEME" | grep -F 'iPhone 16' | grep -F '18.0'

      - name: Resolve pinned NextLevel and preserve its Swift 5 source compatibility
        run: |
          set -euo pipefail
          derived_data="$RUNNER_TEMP/packlab-capture-derived-data"
          package_resolved='apps/ios-capture/PackLabCapture.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved'
          project_file='apps/ios-capture/PackLabCapture.xcodeproj/project.pbxproj'
          before_digest=''
          if [[ -f "$package_resolved" ]]; then
            before_digest="$(shasum -a 256 "$package_resolved" | awk '{ print $1 }')"
          fi
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -derivedDataPath "$derived_data"
          test -s "$package_resolved"
          python3 - "$package_resolved" "$project_file" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          package_resolved = json.loads(Path(sys.argv[1]).read_text())
          project = Path(sys.argv[2]).read_text()
          requirement = re.compile(
              r'repositoryURL = "https://github[.]com/NextLevel/NextLevel";\s*'
              r'requirement = [{]kind = exactVersion; version = 0[.]19[.]1; [}];'
          )
          if len(requirement.findall(project)) != 1:
              raise SystemExit('Xcode project must contain exactly one NextLevel 0.19.1 exact-version requirement.')
          pins = package_resolved.get('pins')
          if not isinstance(pins, list):
              raise SystemExit('Package.resolved must contain a pins array.')
          if len(pins) != 1:
              raise SystemExit(f'Expected only the reviewed NextLevel dependency, found {len(pins)} package pins.')
          nextlevel = [pin for pin in pins if pin.get('identity', '').casefold() == 'nextlevel']
          if len(nextlevel) != 1:
              raise SystemExit(f'Expected exactly one NextLevel pin, found {len(nextlevel)}.')
          pin = nextlevel[0]
          state = pin.get('state', {})
          if pin.get('kind') != 'remoteSourceControl':
              raise SystemExit('NextLevel pin must be a remote source-control package.')
          if pin.get('location', '').rstrip('/').casefold() != 'https://github.com/nextlevel/nextlevel':
              raise SystemExit('NextLevel pin location differs from the declared upstream repository.')
          if state.get('version') != '0.19.1' or not re.fullmatch(r'[0-9a-f]{40}', state.get('revision', '')):
              raise SystemExit('Package.resolved does not pin NextLevel 0.19.1 to a full Git revision.')
          print(f"NextLevel pin: 0.19.1 at {state['revision']}")
          print(f"Resolved package pins: {len(pins)}")
          PY
          after_digest="$(shasum -a 256 "$package_resolved" | awk '{ print $1 }')"
          if [[ -n "$before_digest" && "$before_digest" != "$after_digest" ]]; then
            echo 'Package.resolved changed during resolution; the checked lock must be reviewed and committed.' >&2
            exit 1
          fi
          if git ls-files --error-unmatch "$package_resolved" >/dev/null 2>&1; then
            git diff --exit-code -- "$package_resolved"
          fi
          echo "- Package.resolved SHA-256: $after_digest" | tee -a "$GITHUB_STEP_SUMMARY"
          package_manifest="$derived_data/SourcePackages/checkouts/NextLevel/Package.swift"
          test -f "$package_manifest"
          chmod u+w "$package_manifest"
          python3 - "$package_manifest" <<'PY'
          from pathlib import Path
          import sys

          manifest_path = Path(sys.argv[1])
          manifest = manifest_path.read_text()
          expected = [
              '// swift-tools-version:6.0',
              '.enableUpcomingFeature("ExistentialAny")',
              'swiftLanguageModes: [.version("6")]',
          ]
          if any(manifest.count(value) != 1 for value in expected):
              raise SystemExit('Resolved NextLevel manifest differs from the reviewed 0.19.1 compatibility boundary.')
          manifest = manifest.replace('              .enableUpcomingFeature("ExistentialAny")\n', '')
          manifest = manifest.replace('swiftLanguageModes: [.version("6")]', 'swiftLanguageModes: [.version("5")]')
          manifest_path.write_text(manifest)
          if '.enableUpcomingFeature("ExistentialAny")' in manifest or 'swiftLanguageModes: [.version("5")]' not in manifest:
              raise SystemExit('Could not apply the scoped NextLevel Swift 5 compatibility adjustment.')
          print('NextLevel source version: 0.19.1 (resolved from the exact Xcode project pin)')
          print('Runner-local package language mode: Swift 5; dependency source files remain unchanged')
          PY

      - name: Preserve generated SPM resolution evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: packlab-spm-resolution-${{ github.run_id }}
          path: apps/ios-capture/PackLabCapture.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if-no-files-found: error
          retention-days: 1

      - name: Build PackLabCapture for iOS Simulator without signing
        run: |
          set -euo pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/packlab-capture-derived-data" \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee "$RUNNER_TEMP/packlab-capture-build.log"
          echo '- Simulator app build: PASS' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Validate unsigned simulator product
        run: |
          set -euo pipefail
          app_path="$RUNNER_TEMP/packlab-capture-derived-data/Build/Products/Debug-iphonesimulator/PackLabCapture.app"
          test -d "$app_path"
          test -s "$app_path/Info.plist"
          bundle_identifier="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Info.plist")"
          test -n "$bundle_identifier"
          if [[ -e "$app_path/embedded.mobileprovision" ]]; then
            echo 'Simulator build unexpectedly contains a provisioning profile.' >&2
            exit 1
          fi
          test "$bundle_identifier" = 'com.packlab.capture'
          echo '- Simulator product signing state: validated UNSIGNED' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Prepare unsigned simulator provenance sidecar
        env:
          PACKLAB_ARTIFACT_TYPE: ios_simulator_app
          PACKLAB_SIGNING_STATE: UNSIGNED
          PACKLAB_PRODUCT_NAME: PackLabCapture.app
          PACKLAB_CAPTURE_VERSION: 0.1.0
          PACKLAB_CAPTURE_BUILD: '1'
          PACKLAB_PACKSCAN_SCHEMA_VERSION: 1.0.0
          PACKLAB_XCODE_VERSION: ${{ steps.xcode.outputs.version }}
          PACKLAB_XCODE_BUILD: ${{ steps.xcode.outputs.build }}
          PACKLAB_SDK_NAME: iphonesimulator
          PACKLAB_SDK_VERSION: ${{ steps.xcode.outputs.ios_simulator_sdk }}
          PACKLAB_BUNDLE_IDENTIFIER: com.packlab.capture
          PACKLAB_PACKAGE_RESOLVED_SHA256: ${{ hashFiles('apps/ios-capture/PackLabCapture.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
        run: |
          set -euo pipefail
          python3 tools/ci/ios_artifact_provenance.py prepare \
            --artifact "$RUNNER_TEMP/packlab-capture-derived-data/Build/Products/Debug-iphonesimulator/PackLabCapture.app" \
            --sidecar "$RUNNER_TEMP/packlab-capture-simulator-provenance.json"

      - name: Verify unsigned simulator provenance before upload
        id: verify_simulator_provenance
        run: |
          set -euo pipefail
          python3 tools/ci/ios_artifact_provenance.py verify \
            --artifact "$RUNNER_TEMP/packlab-capture-derived-data/Build/Products/Debug-iphonesimulator/PackLabCapture.app" \
            --sidecar "$RUNNER_TEMP/packlab-capture-simulator-provenance.json"

      - name: Preserve unsigned simulator build product
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: packlab-capture-unsigned-simulator-${{ github.sha }}
          path: |
            ${{ runner.temp }}/packlab-capture-derived-data/Build/Products/Debug-iphonesimulator/PackLabCapture.app
            ${{ runner.temp }}/packlab-capture-simulator-provenance.json
          if-no-files-found: error
          retention-days: 1

      - name: Run PackLabCaptureTests on iOS Simulator without signing
        id: run-xctests
        run: |
          set -euo pipefail
          names=()
          case "$FOCUSED_GROUP" in
            all) ;;
            recovery_all)
              names=(testAuthoritativeDeletionRemovesSessionAndRejectsTraversal testDeletionPlanRequiresConfirmationAndStaysInsideRoot testFinalizationGateDistinguishesBindingAndChecksumFailures testPL0088EveryTransactionFailureStageRecoversCleanPreCaptureState testPL0089RetakeCallbackAndDeleteRetakeFailureStagesRollbackCoherently testPL0090DiscoveryUsesRecoveredStateBlocksCorruptionAndDiscardsOnlyResumableSessions testSessionDiscoveryReconstructsHistoryAndBlocksMissingOrVersionMismatch testPL0073FocusCannotLockBeforeObservedStabilization testPL0080AndPL0081AcceptedStillOrchestrationPersistsPoseMotionAndReopens testPL0083AndPL0085RuntimeRefreshUsesInjectedServicesAndStops testPL0085OverlayPropagatesNewestPoseMotionAndEpochThenStops testPoseClockBridgeBindsAcceptedStillAndExactBoundaries testPL0095CandidateRuntimePublishesAlignedMotionWarningsAndHighRisk testPL0097CandidateRuntimePublishesShadowBandsAndRawObjectFraction testPL0102CoverageUsesExactElevationBoundariesAndAdjacentValuesDeterministically testPL0104ProductionAutoCaptureUsesHealthGatedBackendAndAcceptedTransaction testPL0104ProductionGateMatrixNeverInvokesBackendWhenBlocked testPL0105DuplicateDetectorProvesTranslationElevationAndSignatureBoundaries testPL0106RingAndSectorBoundariesAreDeterministicInLiveGuidance testPL0109ActiveCompletionPropagatesAndPersistsWithOptionalBaseState testPL0109CompletionDiagnosticsDistinguishesCompleteAndUnavailableEvidence testPL0118PreflightIsTableDrivenAcrossPresetsAndHealthConditions testPL0120ProductionSharePresentationStateCoversCancelCompletionFailureAndReplacement testPL0120ShareEligibilityRejectsMissingOrNonPackscanFiles testPL0121SwiftWireModelsMatchSharedGoldenFields)
              ;;
            pl0119_finalization_failures)
              names=(testPL0119InjectedFinalizationFailuresLeaveNoPartialArtifactsAndPreservePriorExport)
              ;;
            session_integrity)
              names=(testAuthoritativeDeletionRemovesSessionAndRejectsTraversal testDeletionPlanRequiresConfirmationAndStaysInsideRoot testFinalizationGateDistinguishesBindingAndChecksumFailures testPL0088EveryTransactionFailureStageRecoversCleanPreCaptureState testPL0089RetakeCallbackAndDeleteRetakeFailureStagesRollbackCoherently testPL0090DiscoveryUsesRecoveredStateBlocksCorruptionAndDiscardsOnlyResumableSessions testSessionDiscoveryReconstructsHistoryAndBlocksMissingOrVersionMismatch)
              ;;
            camera_pose)
              names=(testPL0073FocusCannotLockBeforeObservedStabilization testPL0080AndPL0081AcceptedStillOrchestrationPersistsPoseMotionAndReopens testPL0083AndPL0085RuntimeRefreshUsesInjectedServicesAndStops testPL0085OverlayPropagatesNewestPoseMotionAndEpochThenStops testPoseClockBridgeBindsAcceptedStillAndExactBoundaries)
              ;;
            capture_coverage)
              names=(testPL0095CandidateRuntimePublishesAlignedMotionWarningsAndHighRisk testPL0097CandidateRuntimePublishesShadowBandsAndRawObjectFraction testPL0102CoverageUsesExactElevationBoundariesAndAdjacentValuesDeterministically testPL0104ProductionAutoCaptureUsesHealthGatedBackendAndAcceptedTransaction testPL0104ProductionGateMatrixNeverInvokesBackendWhenBlocked testPL0105DuplicateDetectorProvesTranslationElevationAndSignatureBoundaries testPL0106RingAndSectorBoundariesAreDeterministicInLiveGuidance testPL0109ActiveCompletionPropagatesAndPersistsWithOptionalBaseState testPL0109CompletionDiagnosticsDistinguishesCompleteAndUnavailableEvidence)
              ;;
            preflight_transfer)
              names=(testPL0118PreflightIsTableDrivenAcrossPresetsAndHealthConditions testPL0120ProductionSharePresentationStateCoversCancelCompletionFailureAndReplacement testPL0120ShareEligibilityRejectsMissingOrNonPackscanFiles testPL0121SwiftWireModelsMatchSharedGoldenFields)
              ;;
            *) echo "Unknown focused group: $FOCUSED_GROUP" >&2; exit 2 ;;
          esac
          echo "- XCTest selection: $FOCUSED_GROUP" | tee -a "$GITHUB_STEP_SUMMARY"
          xcodebuild_args=(
            -project "$PROJECT"
            -scheme "$SCHEME"
            -destination "$DESTINATION"
            -derivedDataPath "$RUNNER_TEMP/packlab-capture-derived-data"
            -resultBundlePath "$RUNNER_TEMP/PackLabCapture.xcresult"
            ONLY_ACTIVE_ARCH=YES
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
            CODE_SIGN_IDENTITY=""
          )
          if [[ "$FOCUSED_GROUP" != all ]]; then
            for name in "${names[@]}"; do
              xcodebuild_args+=("-only-testing:PackLabCaptureTests/PackLabCaptureTests/$name")
            done
          fi
          xcodebuild test "${xcodebuild_args[@]}" \
            | tee "$RUNNER_TEMP/packlab-capture-test.log"

      - name: Verify and record XCTest summary
        if: always()
        run: |
          set -euo pipefail
          if [[ ! -d "$RUNNER_TEMP/PackLabCapture.xcresult" ]]; then
            echo 'XCTest result bundle is missing.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          summary="$(xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/PackLabCapture.xcresult" --format json)"
          safe_summary="$(printf '%s' "$summary" | jq '{result, totalTestCount, passedTests, failedTests, skippedTests}')"
          printf '\n## XCTest summary\n\n```json\n%s\n```\n' "$safe_summary" | tee -a "$GITHUB_STEP_SUMMARY"
          result="$(printf '%s' "$safe_summary" | jq -r '.result // "Unknown"')"
          total="$(printf '%s' "$safe_summary" | jq -r '.totalTestCount // 0')"
          failed="$(printf '%s' "$safe_summary" | jq -r '.failedTests // 0')"
          skipped="$(printf '%s' "$safe_summary" | jq -r '.skippedTests // 0')"
          case "$FOCUSED_GROUP" in
            all) expected=205 ;;
            recovery_all) expected=25 ;;
            pl0119_finalization_failures) expected=1 ;;
            session_integrity) expected=7 ;;
            camera_pose) expected=5 ;;
            capture_coverage) expected=9 ;;
            preflight_transfer) expected=4 ;;
            *) echo "Unknown focused group in result verification: $FOCUSED_GROUP" >&2; exit 2 ;;
          esac
          if [[ "$result" != "Passed" || "$total" -ne "$expected" || "$failed" -ne 0 || "$skipped" -ne 0 ]]; then
            echo "XCTest selection did not pass with its expected count (group=$FOCUSED_GROUP, result=$result, total=$total, expected=$expected, failed=$failed, skipped=$skipped)." >&2
            exit 1
          fi

      - name: Guard failed XCTest diagnostic artifact inputs
        id: guard_failed_xctest_diagnostics
        if: ${{ failure() && steps.run-xctests.outcome == 'failure' }}
        run: |
          set -euo pipefail
          result_bundle="$RUNNER_TEMP/PackLabCapture.xcresult"
          test -d "$result_bundle"
          test ! -L "$result_bundle"
          resolved_temp="$(cd "$RUNNER_TEMP" && pwd -P)"
          resolved_bundle="$(cd "$result_bundle" && pwd -P)"
          case "$resolved_bundle" in
            "$resolved_temp"/*) ;;
            *) echo 'XCTest diagnostics are outside the runner temp directory.' >&2; exit 1 ;;
          esac
          size_kib="$(du -sk "$result_bundle" | awk '{ print $1 }')"
          test "$size_kib" -gt 0
          test "$size_kib" -le 1048576
          if find "$result_bundle" -type l -print -quit | grep -q .; then
            echo 'XCTest diagnostics contain a symbolic link.' >&2
            exit 1
          fi
          echo 'Validated bounded XCTest diagnostics under runner temp.'

      - name: Preserve failed XCTest diagnostics for one day
        if: ${{ failure() && steps.guard_failed_xctest_diagnostics.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: packlab-capture-xcresult-${{ github.run_id }}
          path: ${{ runner.temp }}/PackLabCapture.xcresult
          if-no-files-found: error
          retention-days: 1
