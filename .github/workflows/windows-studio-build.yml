name: PackLab Studio Windows Build

on:
  pull_request:
    paths:
      - ".github/workflows/windows-studio-build.yml"
      - "apps/windows-studio/**"
      - "core/**"
      - "docs/architecture/DEPENDENCY_LICENSE_REGISTER.md"
      - "pyproject.toml"
      - "schemas/**"
      - "tests/ci/**"
      - "tests/studio/**"
      - "tools/packaging/**"
      - "uv.lock"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/windows-studio-build.yml"
      - "apps/windows-studio/**"
      - "core/**"
      - "docs/architecture/DEPENDENCY_LICENSE_REGISTER.md"
      - "pyproject.toml"
      - "schemas/**"
      - "tests/ci/**"
      - "tests/studio/**"
      - "tools/packaging/**"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-studio-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-studio:
    name: Build and smoke-test production Studio
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      UV_NO_PROGRESS: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.26"
          enable-cache: false

      - name: Restore exact uv dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/uv-cache
          key: ${{ runner.os }}-${{ runner.arch }}-python-3.12-uv-0.11.26-${{ hashFiles('uv.lock') }}

      - name: Configure uv dependency cache directory
        shell: pwsh
        run: |
          $uvCacheDir = Join-Path $env:RUNNER_TEMP "uv-cache"
          "UV_CACHE_DIR=$uvCacheDir" >> $env:GITHUB_ENV

      - name: Validate lock and install pinned build environment
        shell: pwsh
        run: |
          uv lock --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --locked --all-groups
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --locked python tools/packaging/validate_windows_native_source_lock.py `
            --verify-build-lock --verify-conda-lock --verify-uv-lock
          if ($LASTEXITCODE -ne 0) { throw "Windows native source or package lock validation failed." }

      - name: Create exact OCP source-build environment
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-file: tools/packaging/packlab-ocp-bindings-win.lock
          environment-name: packlab-ocp-bindings
          create-args: --strict-channel-priority
          micromamba-version: "2.0.5-0"
          init-shell: powershell
          cache-environment: false
          post-cleanup: "shell-init"

      - name: Fetch and verify every locked corresponding source
        shell: micromamba-shell {0}
        run: |
          $sourceRoot = Join-Path $env:RUNNER_TEMP "packlab-native-sources"
          $sourceEvidence = Join-Path $env:RUNNER_TEMP "packlab-native-source-evidence.json"
          uv run --locked python tools/packaging/fetch_verify_windows_native_sources.py `
            --download-dir $sourceRoot `
            --evidence $sourceEvidence
          if ($LASTEXITCODE -ne 0) { throw "A locked corresponding-source archive failed SHA-256 verification." }
          "PACKLAB_NATIVE_SOURCE_ROOT=$sourceRoot" >> $env:GITHUB_ENV
          "PACKLAB_NATIVE_SOURCE_EVIDENCE=$sourceEvidence" >> $env:GITHUB_ENV
          Get-Content -LiteralPath $sourceEvidence | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Build and overlay the controlled OCP/OCCT runtime
        shell: micromamba-shell {0}
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          $sitePackages = (uv run --locked python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])").Trim()
          if ($LASTEXITCODE -ne 0 -or !$sitePackages) { throw "The locked production Python site-packages path could not be resolved." }
          $buildRoot = Join-Path $env:RUNNER_TEMP "packlab-controlled-ocp-build"
          $manifest = Join-Path $env:RUNNER_TEMP "windows-ocp-controlled-runtime-manifest.json"
          python tools/packaging/build_controlled_ocp_runtime.py `
            --source-root $env:PACKLAB_NATIVE_SOURCE_ROOT `
            --build-root $buildRoot `
            --site-packages $sitePackages `
            --manifest $manifest
          if ($LASTEXITCODE -ne 0) { throw "The exact-source controlled OCP/OCCT runtime build failed." }
          "PACKLAB_CONTROLLED_OCP_MANIFEST=$manifest" >> $env:GITHUB_ENV

      - name: Create path-free build provenance
        shell: pwsh
        run: |
          $revision = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $revision -notmatch '^[0-9a-f]{40}$') {
            throw "The PackLab build revision is invalid."
          }
          $studioVersion = (uv run --locked python -c "from packlab_studio import __version__; print(__version__)").Trim()
          if ($LASTEXITCODE -ne 0 -or $studioVersion -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            throw "The semantic Studio version is invalid."
          }
          $provenancePath = Join-Path $env:RUNNER_TEMP "packlab-build-provenance.json"
          $provenance = [ordered]@{
            provenance_schema_version = 1
            PACKLAB_BUILD_REVISION = $revision
            studio_version = $studioVersion
          } | ConvertTo-Json -Compress
          [System.IO.File]::WriteAllText($provenancePath, $provenance + "`n", [System.Text.UTF8Encoding]::new($false))
          "PACKLAB_BUILD_REVISION=$revision" >> $env:GITHUB_ENV
          "PACKLAB_PROVENANCE_PATH=$provenancePath" >> $env:GITHUB_ENV
          "PACKLAB_STUDIO_VERSION=$studioVersion" >> $env:GITHUB_ENV

      - name: Build one-directory production Studio staging output
        shell: pwsh
        run: |
          $stagePath = Join-Path $env:GITHUB_WORKSPACE "build\windows-studio"
          $workPath = Join-Path $env:RUNNER_TEMP "packlab-pyinstaller-work"
          $env:PACKLAB_STAGE_PATH = $stagePath
          $env:PACKLAB_WORK_PATH = $workPath
          $pyinstallerArgs = @(
            "-m", "PyInstaller", "--noconfirm", "--clean",
            "--distpath", $stagePath, "--workpath", $workPath,
            "tools/packaging/packlab_studio.spec"
          )
          & uv run --locked python @pyinstallerArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $appDirectory = Join-Path $stagePath "PackLabStudio"
          $studioExe = Join-Path $appDirectory "PackLabStudio.exe"
          if (!(Test-Path -LiteralPath $studioExe -PathType Leaf)) {
            throw "The production Studio executable was not produced."
          }
          $embeddedProvenance = @(Get-ChildItem -LiteralPath $appDirectory -Filter "packlab-build-provenance.json" -File -Recurse)
          if ($embeddedProvenance.Count -ne 1) { throw "Expected exactly one embedded build provenance file." }
          $embedded = Get-Content -LiteralPath $embeddedProvenance[0].FullName -Raw | ConvertFrom-Json
          if ($embedded.PACKLAB_BUILD_REVISION -ne $env:PACKLAB_BUILD_REVISION -or $embedded.studio_version -ne $env:PACKLAB_STUDIO_VERSION) {
            throw "Embedded PackLab revision or Studio version does not match build inputs."
          }
          $forbidden = @(Get-ChildItem -LiteralPath $appDirectory -File -Recurse | Where-Object {
            $_.Extension -in @(".packscan", ".pt", ".pth", ".blend") -or $_.Name -match '^(blender|colmap|openmvs)(\.exe)?$'
          })
          if ($forbidden.Count -gt 0) { throw "Private-data/checkpoint/external-engine content was found in the staging output." }

      - name: Assert staged Qt module surface
        shell: pwsh
        run: |
          $appDirectory = Join-Path $env:GITHUB_WORKSPACE "build\windows-studio\PackLabStudio"
          $assertionPath = Join-Path $appDirectory "qt-staged-surface.json"
          uv run --locked python tools/packaging/assert_staged_qt_surface.py `
            --stage $appDirectory `
            --contract tools/packaging/qt_module_contract.json `
            --output $assertionPath `
            --build-revision $env:PACKLAB_BUILD_REVISION `
            --studio-version $env:PACKLAB_STUDIO_VERSION
          if ($LASTEXITCODE -ne 0) { throw "Staged Qt module contract assertion failed." }
          $assertion = Get-Content -LiteralPath $assertionPath -Raw | ConvertFrom-Json
          if ($assertion.status -ne "PASS") { throw "Staged Qt module assertion did not pass." }
          @(
            "## Approved staged Qt surface",
            "",
            "- Modules: $($assertion.approved_staged_modules -join ', ') ",
            "- Plugins: $($assertion.approved_staged_plugins -join ', ') ",
            "- Forbidden Qt module families absent: $($assertion.forbidden_module_families_absent)"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Smoke-test packaged Studio without network
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $studioExe = Join-Path $env:GITHUB_WORKSPACE "build\windows-studio\PackLabStudio\PackLabStudio.exe"
          $runtimeManifest = Join-Path $env:GITHUB_WORKSPACE "build\windows-studio\PackLabStudio\windows-runtime-capabilities.json"
          $smokeLog = Join-Path $env:RUNNER_TEMP ("packlab-studio-smoke-" + [guid]::NewGuid().ToString("N") + ".log")
          $env:PACKLAB_BUILD_SMOKE_LOG = $smokeLog
          $env:PACKLAB_RUNTIME_CAPABILITIES_PATH = $runtimeManifest
          $smokeProcess = Start-Process -FilePath $studioExe -ArgumentList "--packlab-build-smoke" -WorkingDirectory $env:GITHUB_WORKSPACE -PassThru
          if (!$smokeProcess.WaitForExit(120000)) {
            $smokeProcess.Kill()
            throw "Packaged Studio smoke did not exit within 120 seconds."
          }
          if ($smokeProcess.ExitCode -ne 0) {
            throw "Packaged Studio capability smoke exited with code $($smokeProcess.ExitCode)."
          }
          if (!(Test-Path -LiteralPath $runtimeManifest -PathType Leaf)) { throw "Runtime capability manifest is missing." }
          $capabilities = Get-Content -LiteralPath $runtimeManifest -Raw | ConvertFrom-Json
          $requiredGroups = @("qt_studio_gui", "qt_vector_pdf", "ocp_cad", "open3d_geometry")
          foreach ($group in $requiredGroups) {
            if ($capabilities.capability_groups.$group.status -ne "PASS" -or $capabilities.capability_groups.$group.network -ne "NONE") {
              throw "A required packaged runtime capability did not pass its no-network check."
            }
          }
          if ($capabilities.PACKLAB_BUILD_REVISION -ne $env:PACKLAB_BUILD_REVISION -or $capabilities.studio_version -ne $env:PACKLAB_STUDIO_VERSION) {
            throw "Runtime capability manifest does not match this build revision and Studio version."
          }
          $file = Get-Item -LiteralPath $studioExe
          $hash = (Get-FileHash -LiteralPath $studioExe -Algorithm SHA256).Hash.ToLowerInvariant()
          $files = @(Get-ChildItem -LiteralPath (Split-Path $studioExe -Parent) -File -Recurse)
          $dllCount = @($files | Where-Object Extension -EQ ".dll").Count
          $totalBytes = ($files | Measure-Object -Property Length -Sum).Sum
          @(
            "## PackLab Studio staging smoke",
            "",
            "- Studio version: ``$env:PACKLAB_STUDIO_VERSION``",
            "- Build revision: ``$env:PACKLAB_BUILD_REVISION``",
            "- Executable: ``build/windows-studio/PackLabStudio/PackLabStudio.exe``",
            "- Executable size: $($file.Length) bytes",
            "- Executable SHA-256: ``$hash``",
            "- Staged file count: $($files.Count)",
            "- Staged DLL count: $dllCount",
            "- Total staged size: $totalBytes bytes",
            "- Qt module contract: PASS; approved modules and plugins are recorded in ``qt-staged-surface.json``.",
            "- Runtime capability manifest: ``windows-runtime-capabilities.json``; qt_studio_gui, qt_vector_pdf, ocp_cad, and open3d_geometry all PASS with no network.",
            "- Redistribution: NOT CLEARED; PL-0350 owns native/runtime inventory and notice review. The staging output is not uploaded or a release."
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Validate bidirectional controlled OCP manifest
        shell: pwsh
        run: |
          $appDirectory = Join-Path $env:GITHUB_WORKSPACE "build\windows-studio\PackLabStudio"
          uv run --locked python tools/packaging/validate_controlled_ocp_manifest.py `
            --manifest $env:PACKLAB_CONTROLLED_OCP_MANIFEST `
            --stage $appDirectory
          if ($LASTEXITCODE -ne 0) { throw "Staged OCP native files do not match the exact controlled-runtime manifest." }

      - name: Inventory exact hosted staging tree
        id: inventory
        continue-on-error: true
        shell: pwsh
        run: |
          $appDirectory = Join-Path $env:GITHUB_WORKSPACE "build\windows-studio\PackLabStudio"
          $workPath = Join-Path $env:RUNNER_TEMP "packlab-pyinstaller-work"
          $collectMatches = @(Get-ChildItem -LiteralPath $workPath -Filter "COLLECT-00.toc" -File -Recurse)
          $analysisMatches = @(Get-ChildItem -LiteralPath $workPath -Filter "Analysis-00.toc" -File -Recurse)
          if ($collectMatches.Count -ne 1 -or $analysisMatches.Count -ne 1) {
            throw "Expected exactly one same-build PyInstaller COLLECT and Analysis TOC."
          }
          $evidencePath = Join-Path $env:RUNNER_TEMP "packlab-compliance-preclearance"
          New-Item -ItemType Directory -Path $evidencePath -Force | Out-Null
          uv run --locked python tools/packaging/windows_redistribution_inventory.py `
            --staging-dir $appDirectory `
            --collect-toc $collectMatches[0].FullName `
            --analysis-toc $analysisMatches[0].FullName `
            --project-root $env:GITHUB_WORKSPACE `
            --registry tools/packaging/windows_component_license_registry.json `
            --ocp-manifest $env:PACKLAB_CONTROLLED_OCP_MANIFEST `
            --output-dir $evidencePath `
            --build-revision $env:PACKLAB_BUILD_REVISION `
            --studio-version $env:PACKLAB_STUDIO_VERSION
          $inventoryExit = $LASTEXITCODE
          Copy-Item -LiteralPath $env:PACKLAB_NATIVE_SOURCE_EVIDENCE -Destination $evidencePath
          Copy-Item -LiteralPath $env:PACKLAB_CONTROLLED_OCP_MANIFEST -Destination $evidencePath
          "PACKLAB_COMPLIANCE_EVIDENCE=$evidencePath" >> $env:GITHUB_ENV
          exit $inventoryExit

      - name: Upload text-only pre-clearance evidence
        if: always() && steps.inventory.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: packlab-windows-compliance-preclearance-${{ github.sha }}
          path: ${{ runner.temp }}/packlab-compliance-preclearance/**
          if-no-files-found: error
          retention-days: 1

      - name: Enforce redistribution clearance
        id: clearance
        shell: pwsh
        run: |
          $validationPath = Join-Path $env:PACKLAB_COMPLIANCE_EVIDENCE "compliance-validation.json"
          if (!(Test-Path -LiteralPath $validationPath -PathType Leaf)) {
            throw "Compliance validation evidence is missing; installer generation is blocked."
          }
          $validation = Get-Content -LiteralPath $validationPath -Raw | ConvertFrom-Json
          if ($validation.PACKLAB_BUILD_REVISION -ne $env:PACKLAB_BUILD_REVISION -or
              $validation.studio_version -ne $env:PACKLAB_STUDIO_VERSION -or
              $validation.unresolved_count -ne 0 -or
              $validation.status -ne "CLEARED_FOR_PL0350_ENGINEERING_PACKAGING") {
            throw "The exact hosted staging tree has unresolved redistribution evidence; binary packaging is blocked."
          }
          "cleared=true" >> $env:GITHUB_OUTPUT

      - name: Add reviewed compliance texts to installer input
        if: steps.clearance.outputs.cleared == 'true'
        shell: pwsh
        run: |
          $stagePath = Join-Path $env:GITHUB_WORKSPACE "build\windows-studio\PackLabStudio"
          Copy-Item -LiteralPath (Join-Path $env:PACKLAB_COMPLIANCE_EVIDENCE "THIRD_PARTY_NOTICES.txt") -Destination $stagePath
          Copy-Item -LiteralPath (Join-Path $env:PACKLAB_COMPLIANCE_EVIDENCE "THIRD_PARTY_LICENSES") -Destination $stagePath -Recurse

      - name: Revalidate exact installer input tree
        id: final_inventory
        if: steps.clearance.outputs.cleared == 'true'
        shell: pwsh
        run: |
          $workPath = Join-Path $env:RUNNER_TEMP "packlab-pyinstaller-work"
          $collect = (Get-ChildItem -LiteralPath $workPath -Filter "COLLECT-00.toc" -File -Recurse | Select-Object -First 1).FullName
          $analysis = (Get-ChildItem -LiteralPath $workPath -Filter "Analysis-00.toc" -File -Recurse | Select-Object -First 1).FullName
          $evidencePath = Join-Path $env:RUNNER_TEMP "packlab-compliance-final"
          New-Item -ItemType Directory -Path $evidencePath -Force | Out-Null
          uv run --locked python tools/packaging/windows_redistribution_inventory.py `
            --staging-dir (Join-Path $env:GITHUB_WORKSPACE "build\windows-studio\PackLabStudio") `
            --collect-toc $collect --analysis-toc $analysis `
            --project-root $env:GITHUB_WORKSPACE `
            --registry tools/packaging/windows_component_license_registry.json `
            --ocp-manifest $env:PACKLAB_CONTROLLED_OCP_MANIFEST `
            --output-dir $evidencePath `
            --build-revision $env:PACKLAB_BUILD_REVISION `
            --studio-version $env:PACKLAB_STUDIO_VERSION
          if ($LASTEXITCODE -ne 0) { throw "Final installer input redistribution inventory is unresolved." }
          Copy-Item -LiteralPath $env:PACKLAB_NATIVE_SOURCE_EVIDENCE -Destination $evidencePath
          Copy-Item -LiteralPath $env:PACKLAB_CONTROLLED_OCP_MANIFEST -Destination $evidencePath
          "PACKLAB_FINAL_COMPLIANCE_EVIDENCE=$evidencePath" >> $env:GITHUB_ENV

      - name: Upload final text-only compliance evidence
        if: steps.clearance.outputs.cleared == 'true' && steps.final_inventory.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: packlab-windows-compliance-final-${{ github.sha }}
          path: ${{ runner.temp }}/packlab-compliance-final/**
          if-no-files-found: error
          retention-days: 1

      - name: Install pinned Inno Setup
        if: steps.clearance.outputs.cleared == 'true' && steps.final_inventory.outcome == 'success'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe" -OutFile $installer
          $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732") { throw "Inno Setup installer digest mismatch." }
          $installDir = Join-Path $env:RUNNER_TEMP "innosetup"
          $process = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Pinned Inno Setup installation failed." }
          "PACKLAB_ISCC=$installDir\ISCC.exe" >> $env:GITHUB_ENV

      - name: Build versioned unsigned installer
        id: installer
        if: steps.clearance.outputs.cleared == 'true' && steps.final_inventory.outcome == 'success'
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "packlab-installer"
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          $name = "PackLabStudio-$env:PACKLAB_STUDIO_VERSION-$env:PACKLAB_BUILD_REVISION-unsigned-setup"
          & $env:PACKLAB_ISCC "/DStudioVersion=$env:PACKLAB_STUDIO_VERSION" "/DGitRevision=$env:PACKLAB_BUILD_REVISION" "/DStageDir=$(Join-Path $env:GITHUB_WORKSPACE 'build\windows-studio\PackLabStudio')" "/DOutputDir=$output" "/DOutputName=$name" tools/packaging/PackLabStudio.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }
          $artifact = Join-Path $output ($name + ".exe")
          if (!(Test-Path -LiteralPath $artifact -PathType Leaf)) { throw "Versioned installer was not produced." }
          $hash = (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
          $bytes = (Get-Item -LiteralPath $artifact).Length
          $metadata = [ordered]@{ installer = ($name + ".exe"); studio_version = $env:PACKLAB_STUDIO_VERSION; build_revision = $env:PACKLAB_BUILD_REVISION; sha256 = $hash; byte_length = $bytes; signing = "unsigned"; inno_setup_version = "6.7.3" } | ConvertTo-Json -Compress
          [System.IO.File]::WriteAllText((Join-Path $output "installer-metadata.json"), $metadata + "`n", [System.Text.UTF8Encoding]::new($false))
          "PACKLAB_INSTALLER_DIR=$output" >> $env:GITHUB_ENV

      - name: Upload cleared versioned installer
        if: steps.clearance.outputs.cleared == 'true' && steps.final_inventory.outcome == 'success' && steps.installer.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: packlab-windows-installer-${{ github.sha }}
          path: ${{ runner.temp }}/packlab-installer/**
          if-no-files-found: error
          retention-days: 1
