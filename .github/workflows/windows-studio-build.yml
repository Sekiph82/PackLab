name: PackLab Studio Windows Build

on:
  workflow_dispatch:
    inputs:
      run_native_build:
        description: "Affirmatively authorize the single controlled native build attempt"
        required: true
        default: false
        type: boolean
      preflight_only:
        description: "Run hosted storage and source checks, skipping every native build job"
        required: false
        default: false
        type: boolean
      inspect_retained_sdk:
        description: "Inspect and validate the immutable PL-0350 R02 OCCT SDK artifact without compiling"
        required: false
        default: false
        type: boolean
      build_revision:
        description: "Exact main commit SHA to build"
        required: true
        type: string

permissions:
  contents: read

jobs:
  retained-sdk-inspection:
    name: Inspect retained PL-0350 OCCT SDK checkpoint
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.inspect_retained_sdk == true &&
      inputs.preflight_only == true &&
      github.ref == 'refs/heads/main' &&
      inputs.build_revision == github.sha
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
      - name: Download, authenticate, and inventory the retained SDK
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $env:PYTHONPATH = $env:GITHUB_WORKSPACE
          python -m tools.packaging.inspect_retained_occt_sdk --scratch (Join-Path $env:RUNNER_TEMP "pl0350-retained-sdk-inspection")
          if ($LASTEXITCODE -ne 0) { throw "Retained OCCT SDK verification or inventory failed." }
      - name: Audit every generated source dependency against the retained SDK
        shell: pwsh
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP "pl0350-retained-sdk-inspection"
          $sdk = Join-Path $scratch "sdk"
          if (!(Test-Path -LiteralPath (Join-Path $sdk "occt-sdk-metadata.json"))) {
            $sdkRoots = @(Get-ChildItem -LiteralPath $sdk -Directory | Where-Object { Test-Path -LiteralPath (Join-Path $_.FullName "occt-sdk-metadata.json") })
            if ($sdkRoots.Count -ne 1) { throw "Retained SDK extraction did not have one unambiguous SDK root." }
            $sdk = $sdkRoots[0].FullName
          }
          $generatedZip = Join-Path $scratch "OCP_src_stubs_Windows.zip"
          $occtArchive = Join-Path $scratch "OCCT-a016080bf6738d6.tar.gz"
          Invoke-WebRequest -Uri "https://github.com/CadQuery/OCP/releases/download/7.9.3.1.1/OCP_src_stubs_Windows.zip" -OutFile $generatedZip
          Invoke-WebRequest -Uri "https://github.com/Open-Cascade-SAS/OCCT/archive/a016080bf6738d6aeae020badee4e888ad1540a5.tar.gz" -OutFile $occtArchive
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $generatedZip).Hash.ToLowerInvariant() -ne "290941ef2d34e7b10b7b6bde4577c5d5d0e703342f934c29a55660caaed8dd5b") { throw "Official generated-source archive failed its frozen SHA-256 check." }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $occtArchive).Hash.ToLowerInvariant() -ne "c533f2667b59921bd6bd40ce82e7b9900b0289ccc731af5fdeeba097de80ef0f") { throw "Pinned OCCT source archive failed its source-lock SHA-256 check." }
          $sdkMetadata = Get-Content -LiteralPath (Join-Path $sdk "occt-sdk-metadata.json") -Raw | ConvertFrom-Json
          $report = Join-Path $scratch "retained-sdk-dependency-audit.json"
          python -m tools.packaging.audit_controlled_occt_sdk_dependencies --sdk $sdk --generated-source-zip $generatedZip --occt-source-archive $occtArchive --work-root (Join-Path $scratch "dependency-audit") --expected-run-id "38263302823" --expected-attempt "1" --expected-cache-key $sdkMetadata.cache_key --report $report
          $auditExit = $LASTEXITCODE
          if ($auditExit -eq 2) {
            $audit = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
            if (!$audit.missing_occt_headers.'OpenGl_Context.hxx' -or !$audit.missing_import_libraries.Contains("TKOpenGl.lib") -or !$audit.missing_runtime_dlls.Contains("TKOpenGl.dll")) { throw "Dependency audit failed without proving the expected OpenGL SDK incompatibility." }
            @("## Retained SDK dependency audit", "", "- Result: actual compatibility check correctly rejected the retained OpenGL-disabled SDK before any native compile.", "- Generated modules and translation units: $($audit.generated_modules) / $($audit.translation_units_including_OCP_cpp).", "- Missing OCCT headers: $((@($audit.missing_occt_headers.PSObject.Properties.Name) | Sort-Object) -join ', ').", "- Missing import libraries: $($audit.missing_import_libraries -join ', ').", "- Missing runtime DLLs: $($audit.missing_runtime_dlls -join ', ').", "- Full machine-readable deficiency report: $report") | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } elseif ($auditExit -ne 0) { throw "Generated source-to-SDK dependency audit failed unexpectedly (exit $auditExit)." }
          else { Get-Content -LiteralPath $report -Raw | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }

  capacity-preflight:
    name: Measure hosted storage and build inputs
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.run_native_build == true &&
      github.ref == 'refs/heads/main' &&
      inputs.build_revision == github.sha
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
      - name: Measure disk, current Actions storage, and exact generated-source patch
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $bootstrapPython = (& python -c "import sys; assert sys.version_info[:3] == (3,12,10), sys.version; print(f'{sys.version.split()[0]} | {sys.executable}')").Trim()
          if ($LASTEXITCODE -ne 0 -or !$bootstrapPython) { throw "The hosted preflight bootstrap Python is not the verified Windows 3.12.10 toolcache runtime." }
          python -S -m tools.packaging.verify_windows_workflow_python_imports
          if ($LASTEXITCODE -ne 0) { throw "Repository-local Windows workflow Python module imports failed." }
          $runArtifactCap = 4GB
          $twoRunArtifactCap = 8GB
          $cacheCap = 10GB
          $projectedCacheCap = 4GB
          $tempDrive = [System.IO.Path]::GetPathRoot($env:RUNNER_TEMP).TrimEnd('\').TrimEnd(':')
          $disk = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='$($tempDrive):'"
          $freeBytes = [long]$disk.FreeSpace
          if ($freeBytes -lt 8GB) { throw "Hosted runner has less than 8 GiB free on the build volume." }
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" }
          $artifacts = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts?per_page=100"
          if ($artifacts.total_count -gt 100) { throw "Artifact inventory exceeds the bounded preflight page." }
          $artifactBytes = [long](($artifacts.artifacts | Measure-Object -Property size_in_bytes -Sum).Sum)
          $cacheUsage = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/cache/usage"
          $cacheBytes = [long]$cacheUsage.active_caches_size_in_bytes
          if ($artifactBytes + 2 * $runArtifactCap -gt $twoRunArtifactCap) { throw "Existing artifacts plus cold and warm run caps exceed the 8 GiB retained-artifact ceiling." }
          if ($cacheBytes + $projectedCacheCap -gt $cacheCap) { throw "Existing cache usage plus the 4 GiB exact-key cache budget exceeds GitHub's 10 GiB repository cache limit." }
          $archive = Join-Path $env:RUNNER_TEMP "OCP_src_stubs_Windows.zip"
          Invoke-WebRequest -Uri "https://github.com/CadQuery/OCP/releases/download/7.9.3.1.1/OCP_src_stubs_Windows.zip" -OutFile $archive
          $patchRoot = Join-Path $env:RUNNER_TEMP "ocp-generated-source-preflight"
          $patchManifest = Join-Path $env:RUNNER_TEMP "ocp-generated-source-preflight-manifest.json"
          $env:PYTHONPATH = $env:GITHUB_WORKSPACE
          python -m tools.packaging.prepare_official_ocp_generated_sources --archive $archive --destination $patchRoot --manifest $patchManifest
          if ($LASTEXITCODE -ne 0) { throw "The official generated-source dry-run patch failed." }
          $manifest = Get-Content -LiteralPath $patchManifest -Raw | ConvertFrom-Json
          if ($manifest.input_module_count -ne 319 -or $manifest.output_module_count -ne 315 -or $manifest.registration_count -ne 630) { throw "The dry-run generated-source inventory differs from the frozen 319-to-315 contract." }
          $patchedBytes = (Get-ChildItem -LiteralPath $patchRoot -File -Recurse | Measure-Object -Property Length -Sum).Sum
          $sourceLock = Get-Content -LiteralPath "tools/packaging/windows_native_source_lock.json" -Raw | ConvertFrom-Json
          $licenseSources = @($sourceLock.records | ForEach-Object { "$($_.component): $($_.license_notice_source)" }) -join "`n"
          @("## Hosted capacity and exact input dry-run", "", "- Runner label: windows-2022 (standard public runner).", "- Bootstrap Python: $bootstrapPython.", "- Build volume free before native stages: $freeBytes bytes.", "- Existing Actions artifacts: $($artifacts.total_count) totaling $artifactBytes bytes.", "- Existing Actions cache: $($cacheUsage.active_caches_count) entries totaling $cacheBytes bytes; planned maximum additional cache: $projectedCacheCap bytes of the 10 GiB repository allowance.", "- Artifact policy: at most $runArtifactCap bytes per run, two authorized runs at most $twoRunArtifactCap bytes total, all artifacts retained for one day. The verified GitHub Free included shared-storage allowance is 500 MiB-month (0.488 GiB-month); the two-run cap at 24 hours is 0.267 GiB-month.", "- Stage artifact ceilings: A SDK plus source evidence <=1 GiB; B runtime <=1 GiB; C installer and compliance evidence <=2 GiB.", "- Official ZIP: $((Get-Item -LiteralPath $archive).Length) bytes; patched tree: $patchedBytes bytes; SHA-256: $($manifest.source_archive.sha256).", "- Generated modules: $($manifest.input_module_count) to $($manifest.output_module_count); retained registrations: $($manifest.registration_count).", "- OCCT timing basis: prior measured build 2,560.860 seconds; OCP compile cap 16,200 seconds plus 60 minutes for setup, validation, smoke, and upload; each native job timeout 330 minutes.", "- Locked license/source paths:", $licenseSources) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  occt-sdk:
    name: Build and seal locked OCCT SDK checkpoint
    needs: capacity-preflight
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.run_native_build == true &&
      inputs.preflight_only != true &&
      github.ref == 'refs/heads/main' &&
      inputs.build_revision == github.sha
    runs-on: windows-2022
    timeout-minutes: 330
    outputs:
      sdk-artifact-name: ${{ steps.sdk_identity.outputs.artifact_name }}
      sdk-payload-sha256: ${{ steps.sdk_identity.outputs.payload_sha256 }}
      sdk-byte-count: ${{ steps.sdk_identity.outputs.byte_count }}
      sdk-cache-key: ${{ steps.sdk_identity.outputs.cache_key }}
      source-evidence-artifact-name: ${{ steps.sdk_identity.outputs.source_evidence_artifact_name }}
    env:
      UV_NO_PROGRESS: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
      - name: Install pinned uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.26"
          enable-cache: false
      - name: Validate locks and install the locked project environment
        shell: pwsh
        run: |
          uv lock --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --locked --all-groups
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --locked python -m tools.packaging.validate_windows_native_source_lock --verify-build-lock --verify-conda-lock --verify-uv-lock
          if ($LASTEXITCODE -ne 0) { throw "Native source and package locks are invalid." }
      - name: Render hash-pinned OCP build environment lock
        id: render_ocp_lock
        shell: pwsh
        run: |
          $template = Join-Path $env:RUNNER_TEMP "packlab-ocp-{platform}.lock"
          $lockPath = Join-Path $env:RUNNER_TEMP "packlab-ocp-win-64.lock"
          uv tool run --from conda-lock==3.0.0 conda-lock render --platform win-64 --kind explicit --filename-template $template tools/packaging/packlab-ocp-bindings-win.lock
          if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $lockPath)) { throw "Could not render the exact Windows OCP environment." }
          "path=$lockPath" >> $env:GITHUB_OUTPUT
      - name: Create the exact locked Windows build environment
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-file: ${{ steps.render_ocp_lock.outputs.path }}
          environment-name: packlab-ocp-bindings
          micromamba-version: "2.0.5-0"
          init-shell: powershell
          cache-environment: false
          post-cleanup: "shell-init"
      - name: Assert native OCCT build Python 3.12.15
        shell: pwsh
        run: |
          $nativePython = (& micromamba run -n packlab-ocp-bindings python -c "import sys; assert sys.version_info[:3] == (3,12,15), sys.version; print(sys.executable)").Trim()
          if ($LASTEXITCODE -ne 0 -or !$nativePython) { throw "OCCT native build Python must be the locked micromamba 3.12.15 interpreter." }
          "Native build Python: $nativePython" >> $env:GITHUB_STEP_SUMMARY
      - name: Restore exact OCCT SDK cache
        id: sdk_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/occt-sdk
          key: Windows-x64-occt-sdk-v3-${{ hashFiles('.github/workflows/windows-studio-build.yml', 'tools/packaging/windows_native_source_lock.json', 'tools/packaging/packlab-ocp-bindings-win.lock', 'tools/packaging/controlled_ocp_runtime_contract.json', 'tools/packaging/build_controlled_occt_sdk.py', 'tools/packaging/validate_controlled_occt_sdk.py', 'tools/packaging/audit_controlled_occt_sdk_dependencies.py') }}
      - name: Fetch and verify locked corresponding-source archives
        shell: pwsh
        run: |
          $sourceRoot = Join-Path $env:RUNNER_TEMP "packlab-native-sources"
          $sourceEvidence = Join-Path $env:RUNNER_TEMP "windows-native-source-evidence.json"
          uv run --locked python -m tools.packaging.fetch_verify_windows_native_sources --download-dir $sourceRoot --evidence $sourceEvidence
          if ($LASTEXITCODE -ne 0) { throw "A locked corresponding-source archive failed verification." }
          "PACKLAB_NATIVE_SOURCE_ROOT=$sourceRoot" >> $env:GITHUB_ENV
          "PACKLAB_NATIVE_SOURCE_EVIDENCE=$sourceEvidence" >> $env:GITHUB_ENV
      - name: Validate and re-publish exact SDK cache or build OCCT
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP "occt-sdk"
          $cacheKey = "${{ steps.sdk_cache.outputs.cache-primary-key }}"
          $evidence = Join-Path $env:RUNNER_TEMP "occt-sdk-metadata.json"
          if ("${{ steps.sdk_cache.outputs.cache-hit }}" -eq "true") {
            uv run --locked python -m tools.packaging.validate_controlled_occt_sdk --sdk $sdk --expected-run-id $env:GITHUB_RUN_ID --expected-attempt $env:GITHUB_RUN_ATTEMPT --expected-cache-key $cacheKey --republish-cache
            if ($LASTEXITCODE -ne 0) { throw "The restored OCCT SDK cache failed validation." }
          } else {
            $source = Get-ChildItem -LiteralPath $env:PACKLAB_NATIVE_SOURCE_ROOT -Filter "occt-source-7.9.3--*" -File | Select-Object -First 1
            if (!$source) { throw "Verified OCCT source archive is missing." }
            & micromamba run -n packlab-ocp-bindings python -m tools.packaging.build_controlled_occt_sdk --source-archive $source.FullName --build-root (Join-Path $env:RUNNER_TEMP "packlab-occt-sdk-build") --output $sdk --metadata (Join-Path $sdk "occt-sdk-metadata.json") --cache-key $cacheKey
            if ($LASTEXITCODE -ne 0) { throw "The locked OCCT SDK build failed." }
            uv run --locked python -m tools.packaging.validate_controlled_occt_sdk --sdk $sdk --expected-run-id $env:GITHUB_RUN_ID --expected-attempt $env:GITHUB_RUN_ATTEMPT --expected-cache-key $cacheKey
            if ($LASTEXITCODE -ne 0) { throw "The newly built OCCT SDK failed content validation." }
          }
      - name: Record SDK checkpoint identity and disk budget
        id: sdk_identity
        shell: pwsh
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP "occt-sdk"
          $metadata = Get-Content -LiteralPath (Join-Path $sdk "occt-sdk-metadata.json") -Raw | ConvertFrom-Json
          $sourceEvidenceBytes = (Get-Item -LiteralPath $env:PACKLAB_NATIVE_SOURCE_EVIDENCE).Length
          if ([long]$metadata.byte_count + $sourceEvidenceBytes -gt 1GB) { throw "The OCCT SDK plus source evidence exceeds the 1 GiB stage-A artifact budget." }
          $artifactName = "packlab-occt-sdk-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $evidenceName = "packlab-native-source-evidence-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          "artifact_name=$artifactName" >> $env:GITHUB_OUTPUT
          "source_evidence_artifact_name=$evidenceName" >> $env:GITHUB_OUTPUT
          "payload_sha256=$($metadata.payload_sha256)" >> $env:GITHUB_OUTPUT
          "byte_count=$($metadata.byte_count)" >> $env:GITHUB_OUTPUT
          "cache_key=${{ steps.sdk_cache.outputs.cache-primary-key }}" >> $env:GITHUB_OUTPUT
          $free = (Get-PSDrive C).Free
          @("## OCCT SDK checkpoint", "", "- Cache: `${{ steps.sdk_cache.outputs.cache-hit }}`", "- SDK files: $($metadata.file_count)", "- SDK payload bytes: $($metadata.byte_count)", "- SDK payload SHA-256: ``$($metadata.payload_sha256)``", "- C: free bytes before upload: $free", "- Source lock SHA-256: ``$($metadata.source_lock_sha256)``", "- Producer run/job: ``$env:GITHUB_RUN_ID/$env:GITHUB_JOB``") | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Save exact OCCT SDK cache after size validation
        if: steps.sdk_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/occt-sdk
          key: ${{ steps.sdk_cache.outputs.cache-primary-key }}
      - name: Upload validated OCCT SDK checkpoint
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: ${{ steps.sdk_identity.outputs.artifact_name }}
          path: ${{ runner.temp }}/occt-sdk/**
          if-no-files-found: error
          compression-level: 1
          retention-days: 1
      - name: Upload corresponding-source verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: ${{ steps.sdk_identity.outputs.source_evidence_artifact_name }}
          path: ${{ runner.temp }}/windows-native-source-evidence.json
          if-no-files-found: error
          retention-days: 1

  controlled-ocp-runtime:
    name: Build and seal official 315-module no-VTK OCP runtime
    needs: occt-sdk
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.run_native_build == true &&
      inputs.preflight_only != true &&
      github.ref == 'refs/heads/main' &&
      inputs.build_revision == github.sha
    runs-on: windows-2022
    timeout-minutes: 330
    concurrency:
      group: controlled-ocp-runtime-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    env:
      UV_NO_PROGRESS: "1"
    outputs:
      bundle-artifact-name: ${{ steps.runtime_identity.outputs.artifact_name }}
      bundle-artifact-bytes: ${{ steps.runtime_identity.outputs.artifact_bytes }}
      cache-key: ${{ steps.runtime_identity.outputs.cache_key }}
      manifest-sha256: ${{ steps.runtime_identity.outputs.manifest_sha256 }}
      source-lock-sha256: ${{ steps.runtime_identity.outputs.source_lock_sha256 }}
      bundle-content-sha256: ${{ steps.runtime_identity.outputs.bundle_content_sha256 }}
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
      - name: Install pinned uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.26"
          enable-cache: false
      - name: Validate locks and install the locked project environment
        shell: pwsh
        run: |
          uv lock --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --locked --all-groups
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --locked python -m tools.packaging.validate_windows_native_source_lock --verify-build-lock --verify-conda-lock --verify-uv-lock
          if ($LASTEXITCODE -ne 0) { throw "Native source and package locks are invalid." }
      - name: Render hash-pinned OCP build environment lock
        id: render_ocp_lock
        shell: pwsh
        run: |
          $template = Join-Path $env:RUNNER_TEMP "packlab-ocp-{platform}.lock"
          $lockPath = Join-Path $env:RUNNER_TEMP "packlab-ocp-win-64.lock"
          uv tool run --from conda-lock==3.0.0 conda-lock render --platform win-64 --kind explicit --filename-template $template tools/packaging/packlab-ocp-bindings-win.lock
          if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $lockPath)) { throw "Could not render the exact Windows OCP environment." }
          "path=$lockPath" >> $env:GITHUB_OUTPUT
      - name: Create the exact locked Windows build environment
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-file: ${{ steps.render_ocp_lock.outputs.path }}
          environment-name: packlab-ocp-bindings
          micromamba-version: "2.0.5-0"
          init-shell: powershell
          cache-environment: false
          post-cleanup: "shell-init"
      - name: Assert native OCP compiler Python 3.12.15
        shell: pwsh
        run: |
          $nativePython = (& micromamba run -n packlab-ocp-bindings python -c "import sys; assert sys.version_info[:3] == (3,12,15), sys.version; print(sys.executable)").Trim()
          if ($LASTEXITCODE -ne 0 -or !$nativePython) { throw "OCP CMake must use the locked micromamba 3.12.15 interpreter and headers." }
          "Native compiler Python: $nativePython" >> $env:GITHUB_STEP_SUMMARY
      - name: Download the same-run validated OCCT SDK checkpoint
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.occt-sdk.outputs.sdk-artifact-name }}
          path: ${{ runner.temp }}/occt-sdk
      - name: Download same-run corresponding-source evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.occt-sdk.outputs.source-evidence-artifact-name }}
          path: ${{ runner.temp }}/source-evidence
      - name: Validate SDK artifact producer, manifest, and hashes
        shell: pwsh
        run: |
          uv run --locked python -m tools.packaging.validate_controlled_occt_sdk --sdk (Join-Path $env:RUNNER_TEMP "occt-sdk") --expected-run-id $env:GITHUB_RUN_ID --expected-attempt $env:GITHUB_RUN_ATTEMPT --expected-cache-key "${{ needs.occt-sdk.outputs.sdk-cache-key }}"
          if ($LASTEXITCODE -ne 0) { throw "Same-run OCCT SDK checkpoint failed validation." }
          $sdkMetadata = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP "occt-sdk\occt-sdk-metadata.json") -Raw | ConvertFrom-Json
          if ($sdkMetadata.payload_sha256 -ne "${{ needs.occt-sdk.outputs.sdk-payload-sha256 }}" -or $sdkMetadata.byte_count -ne [long]"${{ needs.occt-sdk.outputs.sdk-byte-count }}") { throw "Downloaded SDK bytes differ from the producer outputs." }
      - name: Download and verify official generated OCP source ZIP
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "OCP_src_stubs_Windows.zip"
          Invoke-WebRequest -Uri "https://github.com/CadQuery/OCP/releases/download/7.9.3.1.1/OCP_src_stubs_Windows.zip" -OutFile $archive
          if (!(Test-Path -LiteralPath $archive -PathType Leaf)) { throw "Official OCP generated source archive is missing." }
          "PACKLAB_OCP_GENERATED_ZIP=$archive" >> $env:GITHUB_ENV
      - name: Restore exact official 315-module OCP runtime cache
        id: controlled_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/controlled-ocp-runtime
          key: Windows-x64-controlled-ocp315-v3-${{ needs.occt-sdk.outputs.sdk-payload-sha256 }}-${{ hashFiles('.github/workflows/windows-studio-build.yml', 'tools/packaging/windows_native_source_lock.json', 'tools/packaging/packlab-ocp-bindings-win.lock', 'tools/packaging/controlled_ocp_runtime_contract.json', 'tools/packaging/prepare_official_ocp_generated_sources.py', 'tools/packaging/build_controlled_occt_sdk.py', 'tools/packaging/build_controlled_ocp_from_generated_sources.py', 'tools/packaging/audit_controlled_occt_sdk_dependencies.py', 'tools/packaging/controlled_ocp_runtime_bundle.py', 'tools/packaging/validate_controlled_ocp_manifest.py', 'tools/packaging/validate_controlled_occt_sdk.py', 'tools/packaging/validate_windows_native_source_lock.py', 'tools/packaging/fetch_verify_windows_native_sources.py') }}-290941ef2d34e7b10b7b6bde4577c5d5d0e703342f934c29a55660caaed8dd5b
      - name: Fail-closed validate restored OCP runtime cache
        id: bundle_cache_check
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP "controlled-ocp-runtime"
          $valid = "false"
          if ("${{ steps.controlled_cache.outputs.cache-hit }}" -eq "true") {
            uv run --locked python -m tools.packaging.controlled_ocp_runtime_bundle validate --bundle $bundle --cache-key "${{ steps.controlled_cache.outputs.cache-primary-key }}"
            if ($LASTEXITCODE -eq 0) {
              $runtimeManifest = Get-Content -LiteralPath (Join-Path $bundle "windows-ocp-controlled-runtime-manifest.json") -Raw | ConvertFrom-Json
              $sdkMetadata = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP "occt-sdk\occt-sdk-metadata.json") -Raw | ConvertFrom-Json
              if ($runtimeManifest.occt_sdk_checkpoint.payload_sha256 -eq $sdkMetadata.payload_sha256) { $valid = "true" }
            }
            if ($valid -ne "true") {
              Remove-Item -LiteralPath $bundle -Recurse -Force
              New-Item -ItemType Directory -Path $bundle -Force | Out-Null
              "CONTROLLED_OCP_CACHE_REJECTED_REBUILD" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            } else {
              "CONTROLLED_OCP_CACHE_HIT_VALIDATED" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }
          } else {
            New-Item -ItemType Directory -Path $bundle -Force | Out-Null
          }
          "valid=$valid" >> $env:GITHUB_OUTPUT
      - name: Build exact official 315-module OCP source and seal runtime
        if: steps.bundle_cache_check.outputs.valid != 'true'
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          Remove-Item Env:Python_ROOT_DIR,Env:Python2_ROOT_DIR,Env:Python3_ROOT_DIR -ErrorAction SilentlyContinue
          $sitePackages = (& micromamba run -n packlab-ocp-bindings python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])").Trim()
          if ($LASTEXITCODE -ne 0 -or !$sitePackages) { throw "The locked Python site-packages path could not be resolved." }
          $occtArchive = Join-Path $env:RUNNER_TEMP "OCCT-a016080bf6738d6.tar.gz"
          Invoke-WebRequest -Uri "https://github.com/Open-Cascade-SAS/OCCT/archive/a016080bf6738d6aeae020badee4e888ad1540a5.tar.gz" -OutFile $occtArchive
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $occtArchive).Hash.ToLowerInvariant() -ne "c533f2667b59921bd6bd40ce82e7b9900b0289ccc731af5fdeeba097de80ef0f") { throw "Pinned OCCT source archive failed its source-lock SHA-256 check." }
          $sourceEvidence = Join-Path $env:RUNNER_TEMP "source-evidence\windows-native-source-evidence.json"
          $manifest = Join-Path $env:RUNNER_TEMP "windows-ocp-controlled-runtime-manifest.json"
          & micromamba run -n packlab-ocp-bindings python -m tools.packaging.build_controlled_ocp_from_generated_sources --generated-source-zip $env:PACKLAB_OCP_GENERATED_ZIP --occt-source-archive $occtArchive --occt-sdk (Join-Path $env:RUNNER_TEMP "occt-sdk") --expected-run-id $env:GITHUB_RUN_ID --expected-attempt $env:GITHUB_RUN_ATTEMPT --expected-cache-key "${{ needs.occt-sdk.outputs.sdk-cache-key }}" --expected-source-lock-sha256 (python -c "import hashlib,pathlib; print(hashlib.sha256(pathlib.Path('tools/packaging/windows_native_source_lock.json').read_bytes()).hexdigest())") --build-root (Join-Path $env:RUNNER_TEMP "packlab-ocp-generated-build") --site-packages $sitePackages --manifest $manifest --compile-timeout-seconds 16200
          if ($LASTEXITCODE -ne 0) { throw "The official generated-source OCP compile failed or exceeded its 270-minute budget." }
          uv run --locked python -m tools.packaging.controlled_ocp_runtime_bundle seal --site-packages $sitePackages --manifest $manifest --source-evidence $sourceEvidence --patch-manifest (Join-Path $env:RUNNER_TEMP "packlab-ocp-generated-build\generated-source-patch-manifest.json") --bundle (Join-Path $env:RUNNER_TEMP "controlled-ocp-runtime") --cache-key "${{ steps.controlled_cache.outputs.cache-primary-key }}"
          if ($LASTEXITCODE -ne 0) { throw "The controlled 315-module runtime failed sealing validation." }
      - name: Validate runtime checkpoint against this run's OCCT payload
        id: validate_bundle
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP "controlled-ocp-runtime"
          uv run --locked python -m tools.packaging.controlled_ocp_runtime_bundle validate --bundle $bundle --cache-key "${{ steps.controlled_cache.outputs.cache-primary-key }}"
          if ($LASTEXITCODE -ne 0) { throw "The controlled runtime failed final provenance validation." }
          $runtimeManifest = Get-Content -LiteralPath (Join-Path $bundle "windows-ocp-controlled-runtime-manifest.json") -Raw | ConvertFrom-Json
          $sdkMetadata = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP "occt-sdk\occt-sdk-metadata.json") -Raw | ConvertFrom-Json
          if ($runtimeManifest.occt_sdk_checkpoint.payload_sha256 -ne $sdkMetadata.payload_sha256) { throw "OCP runtime was not built against this exact OCCT SDK payload." }
      - name: Install controlled runtime and run native CAD smoke
        shell: pwsh
        run: |
          $sitePackages = (& micromamba run -n packlab-ocp-bindings python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])").Trim()
          if ($LASTEXITCODE -ne 0 -or !$sitePackages) { throw "The locked runtime site-packages path could not be resolved." }
          uv run --locked python -m tools.packaging.controlled_ocp_runtime_bundle install --bundle (Join-Path $env:RUNNER_TEMP "controlled-ocp-runtime") --site-packages $sitePackages --cache-key "${{ steps.controlled_cache.outputs.cache-primary-key }}"
          if ($LASTEXITCODE -ne 0) { throw "The validated OCP runtime could not be installed." }
          & micromamba run -n packlab-ocp-bindings python -m tools.packaging.controlled_ocp_runtime_bundle smoke
          if ($LASTEXITCODE -ne 0) { throw "Native OCP BREP smoke failed." }
      - name: Record exact OCP runtime artifact identity
        id: runtime_identity
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP "controlled-ocp-runtime"
          $metadata = Get-Content -LiteralPath (Join-Path $bundle "controlled-runtime-metadata.json") -Raw | ConvertFrom-Json
          $manifest = Join-Path $bundle "windows-ocp-controlled-runtime-manifest.json"
          $manifestSha = (Get-FileHash -LiteralPath $manifest -Algorithm SHA256).Hash.ToLowerInvariant()
          $artifactBytes = (Get-ChildItem -LiteralPath $bundle -File -Recurse | Measure-Object -Property Length -Sum).Sum
          if ([long]$artifactBytes -gt 1GB) { throw "The validated OCP runtime exceeds the 1 GiB stage-B artifact budget." }
          $artifactName = "packlab-controlled-ocp-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          "artifact_name=$artifactName" >> $env:GITHUB_OUTPUT
          "artifact_bytes=$artifactBytes" >> $env:GITHUB_OUTPUT
          "cache_key=${{ steps.controlled_cache.outputs.cache-primary-key }}" >> $env:GITHUB_OUTPUT
          "manifest_sha256=$manifestSha" >> $env:GITHUB_OUTPUT
          "source_lock_sha256=$($metadata.source_lock_sha256)" >> $env:GITHUB_OUTPUT
          "bundle_content_sha256=$($metadata.bundle_content_sha256)" >> $env:GITHUB_OUTPUT
          @("## Controlled 315-module OCP runtime", "", "- Cache: `${{ steps.controlled_cache.outputs.cache-hit }}`", "- Bundle bytes: $artifactBytes", "- Bundle content SHA-256: ``$($metadata.bundle_content_sha256)``", "- Runtime manifest SHA-256: ``$manifestSha``", "- OCP runtime binary SHA-256: $((Get-FileHash -LiteralPath (Get-ChildItem -LiteralPath (Join-Path $bundle 'OCP') -Filter 'OCP*.pyd' -File | Select-Object -First 1).FullName -Algorithm SHA256).Hash.ToLowerInvariant())", "- Generated-source path: $($metadata.toolchain.source_generation); pywrap generation invoked: false", "- SDK checkpoint bytes: ${{ needs.occt-sdk.outputs.sdk-byte-count }}") | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Save exact OCP runtime cache after size validation
        if: steps.bundle_cache_check.outputs.valid != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/controlled-ocp-runtime
          key: ${{ steps.controlled_cache.outputs.cache-primary-key }}
      - name: Upload same-run verified controlled runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: ${{ steps.runtime_identity.outputs.artifact_name }}
          path: ${{ runner.temp }}/controlled-ocp-runtime/**
          if-no-files-found: error
          compression-level: 1
          retention-days: 1
  build-studio:
    name: Package and smoke-test production Studio
    needs: controlled-ocp-runtime
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.run_native_build == true &&
      inputs.preflight_only != true &&
      github.ref == 'refs/heads/main' &&
      inputs.build_revision == github.sha
    runs-on: windows-2022
    timeout-minutes: 330
    concurrency:
      group: windows-studio-package-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      UV_NO_PROGRESS: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record packaging job start
        shell: pwsh
        run: |
          "PACKLAB_PACKAGE_JOB_START_UTC=$([DateTimeOffset]::UtcNow.ToString('o'))" >> $env:GITHUB_ENV
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.26"
          enable-cache: false
      - name: Restore exact uv dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/uv-cache
          key: ${{ runner.os }}-${{ runner.arch }}-python-3.12-uv-0.11.26-${{ hashFiles('uv.lock') }}
      - name: Configure uv dependency cache directory
        shell: pwsh
        run: |
          $uvCacheDir = Join-Path $env:RUNNER_TEMP "uv-cache"
          "UV_CACHE_DIR=$uvCacheDir" >> $env:GITHUB_ENV
      - name: Validate lock and install pinned build environment
        shell: pwsh
        run: |
          uv lock --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --locked --all-groups
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --locked python -m tools.packaging.validate_windows_native_source_lock `
            --verify-build-lock --verify-conda-lock --verify-uv-lock
          if ($LASTEXITCODE -ne 0) { throw "Windows native source or package lock validation failed." }
      - name: Download exact same-run controlled runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.controlled-ocp-runtime.outputs.bundle-artifact-name }}
          path: ${{ runner.temp }}/controlled-ocp-runtime

      - name: Validate and install exact controlled runtime artifact
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP "controlled-ocp-runtime"
          $cacheKey = "${{ needs.controlled-ocp-runtime.outputs.cache-key }}"
          uv run --locked python -m tools.packaging.controlled_ocp_runtime_bundle validate `
            --bundle $bundle `
            --cache-key $cacheKey
          if ($LASTEXITCODE -ne 0) { throw "The same-run controlled runtime artifact failed independent packaging-job validation." }
          $artifactBytes = (Get-ChildItem -LiteralPath $bundle -File -Recurse | Measure-Object -Property Length -Sum).Sum
          if ($artifactBytes -ne [long]"${{ needs.controlled-ocp-runtime.outputs.bundle-artifact-bytes }}") {
            throw "The downloaded same-run controlled runtime artifact byte size differs from the producer output."
          }
          $sitePackages = (uv run --locked python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])").Trim()
          if ($LASTEXITCODE -ne 0 -or !$sitePackages) { throw "The packaging environment site-packages path could not be resolved." }
          uv run --locked python -m tools.packaging.controlled_ocp_runtime_bundle install `
            --bundle $bundle `
            --site-packages $sitePackages `
            --cache-key $cacheKey
          if ($LASTEXITCODE -ne 0) { throw "The verified controlled runtime artifact could not be installed." }
          $manifest = Join-Path $bundle "windows-ocp-controlled-runtime-manifest.json"
          $sourceEvidence = Join-Path $bundle "windows-native-source-evidence.json"
          "PACKLAB_CONTROLLED_OCP_MANIFEST=$manifest" >> $env:GITHUB_ENV
          "PACKLAB_NATIVE_SOURCE_EVIDENCE=$sourceEvidence" >> $env:GITHUB_ENV
          $metadata = Get-Content -LiteralPath (Join-Path $bundle "controlled-runtime-metadata.json") -Raw | ConvertFrom-Json
          $manifestSha = (Get-FileHash -LiteralPath $manifest -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($manifestSha -ne "${{ needs.controlled-ocp-runtime.outputs.manifest-sha256 }}" -or
              $metadata.bundle_content_sha256 -ne "${{ needs.controlled-ocp-runtime.outputs.bundle-content-sha256 }}" -or
              $metadata.source_lock_sha256 -ne "${{ needs.controlled-ocp-runtime.outputs.source-lock-sha256 }}") {
            throw "The downloaded runtime artifact differs from the exact producer job outputs."
          }
          "PACKLAB_CONTROLLED_OCP_ARTIFACT_SHA256=$manifestSha" >> $env:GITHUB_ENV
          "- Downloaded bundle bytes: $artifactBytes (matches producer job output)." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Create path-free build provenance
        shell: pwsh
        run: |
          $revision = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $revision -notmatch '^[0-9a-f]{40}$') {
            throw "The PackLab build revision is invalid."
          }
          $studioVersion = (uv run --locked python -c "from packlab_studio import __version__; print(__version__)").Trim()
          if ($LASTEXITCODE -ne 0 -or $studioVersion -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            throw "The semantic Studio version is invalid."
          }
          $provenancePath = Join-Path $env:RUNNER_TEMP "packlab-build-provenance.json"
          $provenance = [ordered]@{
            provenance_schema_version = 1
            PACKLAB_BUILD_REVISION = $revision
            studio_version = $studioVersion
          } | ConvertTo-Json -Compress
          [System.IO.File]::WriteAllText($provenancePath, $provenance + "`n", [System.Text.UTF8Encoding]::new($false))
          "PACKLAB_BUILD_REVISION=$revision" >> $env:GITHUB_ENV
          "PACKLAB_PROVENANCE_PATH=$provenancePath" >> $env:GITHUB_ENV
          "PACKLAB_STUDIO_VERSION=$studioVersion" >> $env:GITHUB_ENV

      - name: Build one-directory production Studio staging output
        shell: pwsh
        run: |
          $stagePath = Join-Path $env:GITHUB_WORKSPACE "build\windows-studio"
          $workPath = Join-Path $env:RUNNER_TEMP "packlab-pyinstaller-work"
          $env:PACKLAB_STAGE_PATH = $stagePath
          $env:PACKLAB_WORK_PATH = $workPath
          $pyinstallerArgs = @(
            "-m", "PyInstaller", "--noconfirm", "--clean",
            "--distpath", $stagePath, "--workpath", $workPath,
            "tools/packaging/packlab_studio.spec"
          )
          & uv run --locked python @pyinstallerArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $appDirectory = Join-Path $stagePath "PackLabStudio"
          $studioExe = Join-Path $appDirectory "PackLabStudio.exe"
          if (!(Test-Path -LiteralPath $studioExe -PathType Leaf)) {
            throw "The production Studio executable was not produced."
          }
          $embeddedProvenance = @(Get-ChildItem -LiteralPath $appDirectory -Filter "packlab-build-provenance.json" -File -Recurse)
          if ($embeddedProvenance.Count -ne 1) { throw "Expected exactly one embedded build provenance file." }
          $embedded = Get-Content -LiteralPath $embeddedProvenance[0].FullName -Raw | ConvertFrom-Json
          if ($embedded.PACKLAB_BUILD_REVISION -ne $env:PACKLAB_BUILD_REVISION -or $embedded.studio_version -ne $env:PACKLAB_STUDIO_VERSION) {
            throw "Embedded PackLab revision or Studio version does not match build inputs."
          }
          $forbidden = @(Get-ChildItem -LiteralPath $appDirectory -File -Recurse | Where-Object {
            $_.Extension -in @(".packscan", ".pt", ".pth", ".blend") -or $_.Name -match '^(blender|colmap|openmvs)(\.exe)?$'
          })
          if ($forbidden.Count -gt 0) { throw "Private-data/checkpoint/external-engine content was found in the staging output." }

      - name: Assert staged Qt module surface
        shell: pwsh
        run: |
          $appDirectory = Join-Path $env:GITHUB_WORKSPACE "build\windows-studio\PackLabStudio"
          $assertionPath = Join-Path $appDirectory "qt-staged-surface.json"
          uv run --locked python -m tools.packaging.assert_staged_qt_surface `
            --stage $appDirectory `
            --contract tools/packaging/qt_module_contract.json `
            --output $assertionPath `
            --build-revision $env:PACKLAB_BUILD_REVISION `
            --studio-version $env:PACKLAB_STUDIO_VERSION
          if ($LASTEXITCODE -ne 0) { throw "Staged Qt module contract assertion failed." }
          $assertion = Get-Content -LiteralPath $assertionPath -Raw | ConvertFrom-Json
          if ($assertion.status -ne "PASS") { throw "Staged Qt module assertion did not pass." }
          @(
            "## Approved staged Qt surface",
            "",
            "- Modules: $($assertion.approved_staged_modules -join ', ') ",
            "- Plugins: $($assertion.approved_staged_plugins -join ', ') ",
            "- Forbidden Qt module families absent: $($assertion.forbidden_module_families_absent)"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Smoke-test packaged Studio without network
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $studioExe = Join-Path $env:GITHUB_WORKSPACE "build\windows-studio\PackLabStudio\PackLabStudio.exe"
          $runtimeManifest = Join-Path $env:GITHUB_WORKSPACE "build\windows-studio\PackLabStudio\windows-runtime-capabilities.json"
          $smokeLog = Join-Path $env:RUNNER_TEMP ("packlab-studio-smoke-" + [guid]::NewGuid().ToString("N") + ".log")
          $env:PACKLAB_BUILD_SMOKE_LOG = $smokeLog
          $env:PACKLAB_RUNTIME_CAPABILITIES_PATH = $runtimeManifest
          $smokeProcess = Start-Process -FilePath $studioExe -ArgumentList "--packlab-build-smoke" -WorkingDirectory $env:GITHUB_WORKSPACE -PassThru
          if (!$smokeProcess.WaitForExit(120000)) {
            $smokeProcess.Kill()
            throw "Packaged Studio smoke did not exit within 120 seconds."
          }
          if ($smokeProcess.ExitCode -ne 0) {
            throw "Packaged Studio capability smoke exited with code $($smokeProcess.ExitCode)."
          }
          if (!(Test-Path -LiteralPath $runtimeManifest -PathType Leaf)) { throw "Runtime capability manifest is missing." }
          $capabilities = Get-Content -LiteralPath $runtimeManifest -Raw | ConvertFrom-Json
          $requiredGroups = @("qt_studio_gui", "qt_vector_pdf", "ocp_cad", "step_io", "dxf_export", "open3d_geometry")
          foreach ($group in $requiredGroups) {
            if ($capabilities.capability_groups.$group.status -ne "PASS" -or $capabilities.capability_groups.$group.network -ne "NONE") {
              throw "A required packaged runtime capability did not pass its no-network check."
            }
          }
          if ($capabilities.PACKLAB_BUILD_REVISION -ne $env:PACKLAB_BUILD_REVISION -or $capabilities.studio_version -ne $env:PACKLAB_STUDIO_VERSION) {
            throw "Runtime capability manifest does not match this build revision and Studio version."
          }
          $file = Get-Item -LiteralPath $studioExe
          $hash = (Get-FileHash -LiteralPath $studioExe -Algorithm SHA256).Hash.ToLowerInvariant()
          $files = @(Get-ChildItem -LiteralPath (Split-Path $studioExe -Parent) -File -Recurse)
          $dllCount = @($files | Where-Object Extension -EQ ".dll").Count
          $totalBytes = ($files | Measure-Object -Property Length -Sum).Sum
          @(
            "## PackLab Studio staging smoke",
            "",
            "- Studio version: ``$env:PACKLAB_STUDIO_VERSION``",
            "- Build revision: ``$env:PACKLAB_BUILD_REVISION``",
            "- Executable: ``build/windows-studio/PackLabStudio/PackLabStudio.exe``",
            "- Executable size: $($file.Length) bytes",
            "- Executable SHA-256: ``$hash``",
            "- Staged file count: $($files.Count)",
            "- Staged DLL count: $dllCount",
            "- Total staged size: $totalBytes bytes",
            "- Qt module contract: PASS; approved modules and plugins are recorded in ``qt-staged-surface.json``.",
            "- Runtime capability manifest: ``windows-runtime-capabilities.json``; Qt GUI/PDF, OCP CAD, STEP, DXF, and Open3D groups all PASS with no network.",
            "- Redistribution: NOT CLEARED; PL-0350 owns native/runtime inventory and notice review. The staging output is not uploaded or a release."
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Validate bidirectional controlled OCP manifest
        shell: pwsh
        run: |
          $appDirectory = Join-Path $env:GITHUB_WORKSPACE "build\windows-studio\PackLabStudio"
          uv run --locked python -m tools.packaging.validate_controlled_ocp_manifest `
            --manifest $env:PACKLAB_CONTROLLED_OCP_MANIFEST `
            --stage $appDirectory
          if ($LASTEXITCODE -ne 0) { throw "Staged OCP native files do not match the exact controlled-runtime manifest." }

      - name: Inventory exact hosted staging tree
        id: inventory
        continue-on-error: true
        shell: pwsh
        run: |
          $appDirectory = Join-Path $env:GITHUB_WORKSPACE "build\windows-studio\PackLabStudio"
          $workPath = Join-Path $env:RUNNER_TEMP "packlab-pyinstaller-work"
          $collectMatches = @(Get-ChildItem -LiteralPath $workPath -Filter "COLLECT-00.toc" -File -Recurse)
          $analysisMatches = @(Get-ChildItem -LiteralPath $workPath -Filter "Analysis-00.toc" -File -Recurse)
          if ($collectMatches.Count -ne 1 -or $analysisMatches.Count -ne 1) {
            throw "Expected exactly one same-build PyInstaller COLLECT and Analysis TOC."
          }
          $evidencePath = Join-Path $env:RUNNER_TEMP "packlab-compliance-preclearance"
          New-Item -ItemType Directory -Path $evidencePath -Force | Out-Null
          uv run --locked python -m tools.packaging.windows_redistribution_inventory `
            --staging-dir $appDirectory `
            --collect-toc $collectMatches[0].FullName `
            --analysis-toc $analysisMatches[0].FullName `
            --project-root $env:GITHUB_WORKSPACE `
            --registry tools/packaging/windows_component_license_registry.json `
            --ocp-manifest $env:PACKLAB_CONTROLLED_OCP_MANIFEST `
            --output-dir $evidencePath `
            --build-revision $env:PACKLAB_BUILD_REVISION `
            --studio-version $env:PACKLAB_STUDIO_VERSION
          $inventoryExit = $LASTEXITCODE
          Copy-Item -LiteralPath $env:PACKLAB_NATIVE_SOURCE_EVIDENCE -Destination $evidencePath
          Copy-Item -LiteralPath $env:PACKLAB_CONTROLLED_OCP_MANIFEST -Destination $evidencePath
          "PACKLAB_COMPLIANCE_EVIDENCE=$evidencePath" >> $env:GITHUB_ENV
          exit $inventoryExit

      - name: Enforce pre-clearance evidence size budget
        id: preclearance_size
        if: always() && steps.inventory.outcome != 'skipped'
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP "packlab-compliance-preclearance"
          $bytes = [long]((Get-ChildItem -LiteralPath $evidence -File -Recurse | Measure-Object -Property Length -Sum).Sum)
          if ($bytes -gt 100MB) { throw "Text-only pre-clearance evidence exceeds its 100 MiB artifact budget." }
          "byte_count=$bytes" >> $env:GITHUB_OUTPUT
      - name: Upload text-only pre-clearance evidence
        if: always() && steps.inventory.outcome != 'skipped' && steps.preclearance_size.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: packlab-windows-compliance-preclearance-${{ github.sha }}
          path: ${{ runner.temp }}/packlab-compliance-preclearance/**
          if-no-files-found: error
          retention-days: 1

      - name: Enforce redistribution clearance
        id: clearance
        shell: pwsh
        run: |
          $validationPath = Join-Path $env:PACKLAB_COMPLIANCE_EVIDENCE "compliance-validation.json"
          if (!(Test-Path -LiteralPath $validationPath -PathType Leaf)) {
            throw "Compliance validation evidence is missing; installer generation is blocked."
          }
          $validation = Get-Content -LiteralPath $validationPath -Raw | ConvertFrom-Json
          if ($validation.PACKLAB_BUILD_REVISION -ne $env:PACKLAB_BUILD_REVISION -or
              $validation.studio_version -ne $env:PACKLAB_STUDIO_VERSION -or
              $validation.unresolved_count -ne 0 -or
              $validation.status -ne "CLEARED_FOR_PL0350_ENGINEERING_PACKAGING") {
            throw "The exact hosted staging tree has unresolved redistribution evidence; binary packaging is blocked."
          }
          "cleared=true" >> $env:GITHUB_OUTPUT

      - name: Add reviewed compliance texts to installer input
        if: steps.clearance.outputs.cleared == 'true'
        shell: pwsh
        run: |
          $stagePath = Join-Path $env:GITHUB_WORKSPACE "build\windows-studio\PackLabStudio"
          Copy-Item -LiteralPath (Join-Path $env:PACKLAB_COMPLIANCE_EVIDENCE "THIRD_PARTY_NOTICES.txt") -Destination $stagePath
          Copy-Item -LiteralPath (Join-Path $env:PACKLAB_COMPLIANCE_EVIDENCE "THIRD_PARTY_LICENSES") -Destination $stagePath -Recurse

      - name: Revalidate exact installer input tree
        id: final_inventory
        if: steps.clearance.outputs.cleared == 'true'
        shell: pwsh
        run: |
          $workPath = Join-Path $env:RUNNER_TEMP "packlab-pyinstaller-work"
          $collect = (Get-ChildItem -LiteralPath $workPath -Filter "COLLECT-00.toc" -File -Recurse | Select-Object -First 1).FullName
          $analysis = (Get-ChildItem -LiteralPath $workPath -Filter "Analysis-00.toc" -File -Recurse | Select-Object -First 1).FullName
          $evidencePath = Join-Path $env:RUNNER_TEMP "packlab-compliance-final"
          New-Item -ItemType Directory -Path $evidencePath -Force | Out-Null
          uv run --locked python -m tools.packaging.windows_redistribution_inventory `
            --staging-dir (Join-Path $env:GITHUB_WORKSPACE "build\windows-studio\PackLabStudio") `
            --collect-toc $collect --analysis-toc $analysis `
            --project-root $env:GITHUB_WORKSPACE `
            --registry tools/packaging/windows_component_license_registry.json `
            --ocp-manifest $env:PACKLAB_CONTROLLED_OCP_MANIFEST `
            --output-dir $evidencePath `
            --build-revision $env:PACKLAB_BUILD_REVISION `
            --studio-version $env:PACKLAB_STUDIO_VERSION
          if ($LASTEXITCODE -ne 0) { throw "Final installer input redistribution inventory is unresolved." }
          Copy-Item -LiteralPath $env:PACKLAB_NATIVE_SOURCE_EVIDENCE -Destination $evidencePath
          Copy-Item -LiteralPath $env:PACKLAB_CONTROLLED_OCP_MANIFEST -Destination $evidencePath
          "PACKLAB_FINAL_COMPLIANCE_EVIDENCE=$evidencePath" >> $env:GITHUB_ENV

      - name: Enforce final compliance evidence size budget
        id: final_compliance_size
        if: steps.clearance.outputs.cleared == 'true' && steps.final_inventory.outcome == 'success'
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP "packlab-compliance-final"
          $bytes = [long]((Get-ChildItem -LiteralPath $evidence -File -Recurse | Measure-Object -Property Length -Sum).Sum)
          if ($bytes -gt 100MB) { throw "Final text-only compliance evidence exceeds its 100 MiB artifact budget." }
          "byte_count=$bytes" >> $env:GITHUB_OUTPUT
      - name: Upload final text-only compliance evidence
        if: steps.clearance.outputs.cleared == 'true' && steps.final_inventory.outcome == 'success' && steps.final_compliance_size.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: packlab-windows-compliance-final-${{ github.sha }}
          path: ${{ runner.temp }}/packlab-compliance-final/**
          if-no-files-found: error
          retention-days: 1

      - name: Install pinned Inno Setup
        if: steps.clearance.outputs.cleared == 'true' && steps.final_inventory.outcome == 'success'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe" -OutFile $installer
          $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732") { throw "Inno Setup installer digest mismatch." }
          $installDir = Join-Path $env:RUNNER_TEMP "innosetup"
          $process = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Pinned Inno Setup installation failed." }
          "PACKLAB_ISCC=$installDir\ISCC.exe" >> $env:GITHUB_ENV

      - name: Build versioned unsigned installer
        id: installer
        if: steps.clearance.outputs.cleared == 'true' && steps.final_inventory.outcome == 'success'
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "packlab-installer"
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          $name = "PackLabStudio-$env:PACKLAB_STUDIO_VERSION-$env:PACKLAB_BUILD_REVISION-unsigned-setup"
          & $env:PACKLAB_ISCC "/DStudioVersion=$env:PACKLAB_STUDIO_VERSION" "/DGitRevision=$env:PACKLAB_BUILD_REVISION" "/DStageDir=$(Join-Path $env:GITHUB_WORKSPACE 'build\windows-studio\PackLabStudio')" "/DOutputDir=$output" "/DOutputName=$name" tools/packaging/PackLabStudio.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }
          $artifact = Join-Path $output ($name + ".exe")
          if (!(Test-Path -LiteralPath $artifact -PathType Leaf)) { throw "Versioned installer was not produced." }
          $hash = (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
          $bytes = (Get-Item -LiteralPath $artifact).Length
          if ([long]$bytes -gt 1800MB) { throw "The unsigned installer exceeds the 1,800 MiB installer budget." }
          $metadata = [ordered]@{ installer = ($name + ".exe"); studio_version = $env:PACKLAB_STUDIO_VERSION; build_revision = $env:PACKLAB_BUILD_REVISION; sha256 = $hash; byte_length = $bytes; signing = "unsigned"; inno_setup_version = "6.7.3" } | ConvertTo-Json -Compress
          [System.IO.File]::WriteAllText((Join-Path $output "installer-metadata.json"), $metadata + "`n", [System.Text.UTF8Encoding]::new($false))
          "PACKLAB_INSTALLER_DIR=$output" >> $env:GITHUB_ENV

      - name: Upload cleared versioned installer
        if: steps.clearance.outputs.cleared == 'true' && steps.final_inventory.outcome == 'success' && steps.installer.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: packlab-windows-installer-${{ github.sha }}
          path: ${{ runner.temp }}/packlab-installer/**
          if-no-files-found: error
          retention-days: 1
      - name: Record packaging job duration
        if: always()
        shell: pwsh
        run: |
          if ($env:PACKLAB_PACKAGE_JOB_START_UTC) {
            $started = [DateTimeOffset]::Parse($env:PACKLAB_PACKAGE_JOB_START_UTC)
            $ended = [DateTimeOffset]::UtcNow
            $duration = [Math]::Round(($ended - $started).TotalSeconds, 3)
            "## Packaging job timing`n`n- Total duration from post-checkout start: $duration seconds." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } else {
            "## Packaging job timing`n`n- Duration unavailable because checkout/start marker was not reached." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
