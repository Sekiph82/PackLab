name: PackLab Capture Signed IPA

# PL-0358: optional, secret-safe signed IPA export.
# The unsigned simulator/device-archive path in packlab-capture-macos.yml stays the
# default for push and pull_request. This workflow is manual-only, runs only from
# main, and reads signing secrets only inside the protected `ios-signing`
# environment. Absent credentials skip signing explicitly; partial credentials fail.
# Secret values are only mapped through step `env`, never interpolated into `run`.

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: Xcode export method that matches the provisioning profile
        type: choice
        required: true
        default: release-testing
        options:
          - release-testing
          - debugging
      upload_signed_ipa:
        description: Upload the IPA (embeds the profile, team ID and device UDIDs) for one day
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: packlab-capture-signed-ipa
  cancel-in-progress: false

jobs:
  capture-signed-ipa:
    name: Optional signed iOS IPA export
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: macos-15
    timeout-minutes: 45
    environment: ios-signing
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      PROJECT: apps/ios-capture/PackLabCapture.xcodeproj
      SCHEME: PackLabCapture
      EXPORT_METHOD: ${{ inputs.export_method }}

    steps:
      - name: Check signing inputs without reading their values
        id: signing-inputs
        env:
          HAS_CERTIFICATE: ${{ secrets.PACKLAB_IOS_CERTIFICATE_P12_BASE64 != '' }}
          HAS_CERTIFICATE_PASSWORD: ${{ secrets.PACKLAB_IOS_CERTIFICATE_PASSWORD != '' }}
          HAS_PROFILE: ${{ secrets.PACKLAB_IOS_PROVISIONING_PROFILE_BASE64 != '' }}
        run: |
          set -euo pipefail
          present=0
          for flag in "$HAS_CERTIFICATE" "$HAS_CERTIFICATE_PASSWORD" "$HAS_PROFILE"; do
            if [[ "$flag" == 'true' ]]; then present=$((present + 1)); fi
          done
          if [[ "$present" -eq 0 ]]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '- Signing: SKIPPED_CREDENTIALS_ABSENT; no signed IPA was produced' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$present" -ne 3 ]]; then
            echo 'Signing inputs are partially configured; refusing to continue.' >&2
            exit 1
          fi
          echo 'configured=true' >> "$GITHUB_OUTPUT"

      - name: Check out source
        if: ${{ steps.signing-inputs.outputs.configured == 'true' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Select Xcode and record signing toolchain
        id: archive-xcode
        if: ${{ steps.signing-inputs.outputs.configured == 'true' }}
        run: |
          set -euo pipefail
          test -d /Applications/Xcode_16.app
          sudo xcode-select --switch /Applications/Xcode_16.app
          xcode_version="$(xcodebuild -version | awk '/^Xcode / { print $2 }')"
          xcode_build="$(xcodebuild -version | awk '/^Build version / { print $3 }')"
          ios_sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          test -n "$xcode_version"
          test -n "$xcode_build"
          test -n "$ios_sdk"
          echo "version=$xcode_version" >> "$GITHUB_OUTPUT"
          echo "build=$xcode_build" >> "$GITHUB_OUTPUT"
          echo "ios_sdk=$ios_sdk" >> "$GITHUB_OUTPUT"
          {
            echo '## Optional signed IPA toolchain'
            echo
            echo "- macOS: $(sw_vers -productVersion)"
            echo "- Xcode: $(xcodebuild -version | tr '\n' ' ')"
            echo "- iOS SDK: $ios_sdk"
            echo "- Export method: $EXPORT_METHOD"
            echo "- Source revision: $GITHUB_SHA"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Resolve and validate the exact NextLevel package pin
        if: ${{ steps.signing-inputs.outputs.configured == 'true' }}
        run: |
          set -euo pipefail
          derived_data="$RUNNER_TEMP/packlab-capture-archive-derived-data"
          package_resolved='apps/ios-capture/PackLabCapture.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved'
          project_file='apps/ios-capture/PackLabCapture.xcodeproj/project.pbxproj'
          test -s "$package_resolved"
          before_digest="$(shasum -a 256 "$package_resolved" | awk '{ print $1 }')"
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -derivedDataPath "$derived_data"
          after_digest="$(shasum -a 256 "$package_resolved" | awk '{ print $1 }')"
          test "$before_digest" = "$after_digest"
          python3 - "$package_resolved" "$project_file" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          lock = json.loads(Path(sys.argv[1]).read_text())
          project = Path(sys.argv[2]).read_text()
          exact_pin = re.compile(
              r'repositoryURL = "https://github[.]com/NextLevel/NextLevel";\s*'
              r'requirement = [{]kind = exactVersion; version = 0[.]19[.]1; [}];'
          )
          pins = lock.get('pins')
          if len(exact_pin.findall(project)) != 1 or not isinstance(pins, list) or len(pins) != 1:
              raise SystemExit('Expected the reviewed single exact NextLevel 0.19.1 dependency.')
          pin = pins[0]
          state = pin.get('state', {})
          if (
              pin.get('identity', '').casefold() != 'nextlevel'
              or state.get('version') != '0.19.1'
              or not re.fullmatch(r'[0-9a-f]{40}', state.get('revision', ''))
          ):
              raise SystemExit('Package.resolved differs from the reviewed NextLevel 0.19.1 revision pin.')
          print(f"NextLevel pin: 0.19.1 at {state['revision']}")
          PY
          package_manifest="$derived_data/SourcePackages/checkouts/NextLevel/Package.swift"
          test -f "$package_manifest"
          chmod u+w "$package_manifest"
          python3 - "$package_manifest" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          manifest = path.read_text()
          expected = [
              '// swift-tools-version:6.0',
              '.enableUpcomingFeature("ExistentialAny")',
              'swiftLanguageModes: [.version("6")]',
          ]
          if any(manifest.count(value) != 1 for value in expected):
              raise SystemExit('Resolved NextLevel manifest differs from the reviewed 0.19.1 compatibility boundary.')
          manifest = manifest.replace('              .enableUpcomingFeature("ExistentialAny")\n', '')
          manifest = manifest.replace('swiftLanguageModes: [.version("6")]', 'swiftLanguageModes: [.version("5")]')
          path.write_text(manifest)
          if '.enableUpcomingFeature("ExistentialAny")' in manifest or 'swiftLanguageModes: [.version("5")]' not in manifest:
              raise SystemExit('Could not apply the runner-local NextLevel Swift 5 compatibility adjustment.')
          print('Applied runner-local Swift 5 compatibility adjustment to NextLevel 0.19.1 manifest only.')
          PY
          echo "- Package.resolved SHA-256: $after_digest" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install signing material into a temporary keychain
        if: ${{ steps.signing-inputs.outputs.configured == 'true' }}
        env:
          PACKLAB_IOS_CERTIFICATE_P12_BASE64: ${{ secrets.PACKLAB_IOS_CERTIFICATE_P12_BASE64 }}
          PACKLAB_IOS_CERTIFICATE_PASSWORD: ${{ secrets.PACKLAB_IOS_CERTIFICATE_PASSWORD }}
          PACKLAB_IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.PACKLAB_IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          signing_dir="$RUNNER_TEMP/packlab-signing"
          keychain="$signing_dir/packlab-signing.keychain-db"
          mkdir -p "$signing_dir"
          printf '%s' "$PACKLAB_IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$signing_dir/certificate.p12"
          printf '%s' "$PACKLAB_IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$signing_dir/profile.mobileprovision"
          security cms -D -i "$signing_dir/profile.mobileprovision" -o "$signing_dir/profile.plist" 2>/dev/null
          python3 - "$signing_dir/profile.plist" "$signing_dir/signing.json" "$EXPORT_METHOD" <<'PY'
          import datetime
          import json
          import plistlib
          import re
          import sys
          from pathlib import Path

          profile = plistlib.loads(Path(sys.argv[1]).read_bytes())
          method = sys.argv[3]
          if method not in {'release-testing', 'debugging'}:
              raise SystemExit('Export method is not in the reviewed allow-list.')
          entitlements = profile.get('Entitlements', {})
          teams = profile.get('TeamIdentifier', [])
          uuid = profile.get('UUID', '')
          if len(teams) != 1 or not re.fullmatch(r'[A-Z0-9]{10}', teams[0]):
              raise SystemExit('Provisioning profile team identifier is missing or invalid.')
          if not re.fullmatch(r'[0-9A-Fa-f-]{36}', uuid):
              raise SystemExit('Provisioning profile UUID is missing or invalid.')
          if entitlements.get('application-identifier') != f'{teams[0]}.com.packlab.capture':
              raise SystemExit('Provisioning profile does not cover com.packlab.capture.')
          if profile.get('ProvisionsAllDevices'):
              raise SystemExit('Enterprise profiles are not supported by this workflow.')
          if not profile.get('ProvisionedDevices'):
              raise SystemExit('Provisioning profile lists no devices; only development/ad hoc are supported.')
          if bool(entitlements.get('get-task-allow')) != (method == 'debugging'):
              raise SystemExit('Provisioning profile type does not match the selected export method.')
          expiry = profile.get('ExpirationDate')
          if not isinstance(expiry, datetime.datetime) or expiry.replace(tzinfo=None) <= datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None):
              raise SystemExit('Provisioning profile is expired or has no expiration date.')
          identity = 'Apple Development' if method == 'debugging' else 'Apple Distribution'
          Path(sys.argv[2]).write_text(json.dumps({
              'team_id': teams[0],
              'profile_uuid': uuid,
              'identity': identity,
              'method': method,
          }))
          PY
          team_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["team_id"])' "$signing_dir/signing.json")"
          profile_uuid="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["profile_uuid"])' "$signing_dir/signing.json")"
          echo "::add-mask::$team_id"
          echo "::add-mask::$profile_uuid"
          # Xcode 16 reads profiles from UserData; older Xcode from MobileDevice. Install in both.
          for profiles_dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$profiles_dir"
            cp "$signing_dir/profile.mobileprovision" "$profiles_dir/$profile_uuid.mobileprovision"
          done
          keychain_password="$(openssl rand -hex 32)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$signing_dir/certificate.p12" -k "$keychain" -f pkcs12 \
            -P "$PACKLAB_IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security > /dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          rm -f "$signing_dir/certificate.p12"
          existing_keychains="$(security list-keychains -d user | tr -d '"' | xargs)"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$keychain" $existing_keychains
          if ! security find-identity -v -p codesigning "$keychain" | grep -Eq '[1-9][0-9]* valid identities found'; then
            echo 'No valid code-signing identity was imported.' >&2
            exit 1
          fi
          echo '- Signing material: installed in a temporary runner keychain (values not logged)' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Apply runner-local manual signing to the app target only
        if: ${{ steps.signing-inputs.outputs.configured == 'true' }}
        run: |
          set -euo pipefail
          python3 - apps/ios-capture/PackLabCapture.xcodeproj/project.pbxproj "$RUNNER_TEMP/packlab-signing/signing.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          signing = json.loads(Path(sys.argv[2]).read_text())
          lines = path.read_text().splitlines(keepends=True)
          hits = [
              index
              for index, line in enumerate(lines)
              if '/* Release */' in line
              and 'PRODUCT_BUNDLE_IDENTIFIER = com.packlab.capture;' in line
              and line.count('CODE_SIGN_STYLE = Automatic;') == 1
          ]
          if len(hits) != 1:
              raise SystemExit('Expected exactly one PackLabCapture Release configuration.')
          manual = (
              'CODE_SIGN_STYLE = Manual; '
              f"DEVELOPMENT_TEAM = {signing['team_id']}; "
              f"CODE_SIGN_IDENTITY = \"{signing['identity']}\"; "
              f"PROVISIONING_PROFILE_SPECIFIER = \"{signing['profile_uuid']}\";"
          )
          lines[hits[0]] = lines[hits[0]].replace('CODE_SIGN_STYLE = Automatic;', manual)
          path.write_text(''.join(lines))
          print('Applied runner-local manual signing to the PackLabCapture Release configuration only.')
          PY

      - name: Archive and export signed PackLabCapture IPA
        if: ${{ steps.signing-inputs.outputs.configured == 'true' }}
        run: |
          set -euo pipefail
          signing_dir="$RUNNER_TEMP/packlab-signing"
          archive_path="$RUNNER_TEMP/PackLabCapture-signed.xcarchive"
          export_path="$RUNNER_TEMP/packlab-signed-export"
          python3 - "$signing_dir/signing.json" "$signing_dir/ExportOptions.plist" <<'PY'
          import json
          import plistlib
          import sys
          from pathlib import Path

          signing = json.loads(Path(sys.argv[1]).read_text())
          options = {
              'method': signing['method'],
              'teamID': signing['team_id'],
              'signingStyle': 'manual',
              'signingCertificate': signing['identity'],
              'provisioningProfiles': {'com.packlab.capture': signing['profile_uuid']},
              'compileBitcode': False,
              'stripSwiftSymbols': True,
              'thinning': '<none>',
          }
          Path(sys.argv[2]).write_bytes(plistlib.dumps(options))
          PY
          # Actions logs are public: never print xcodebuild output (certificate common
          # names, profile names, team IDs). Report only a count; logs stay on the runner.
          # Prints counts only: the total and fixed diagnostic categories, never log text.
          report_failure() {
            local log="$2"
            _n() { grep -ciE "$1" "$log" 2>/dev/null || true; }
            echo "xcodebuild $1 failed with $(_n 'error:') error line(s); log kept on the runner only." >&2
            echo "error categories (counts only): profile=$(_n 'error:.*(provisioning profile|no profile)') certificate=$(_n 'error:.*(certificate|signing identit)') entitlement=$(_n 'error:.*entitlement') team=$(_n 'error:.*(development team|team id)') compile=$(_n 'error:.*([.]swift|cannot find|expected )')" >&2
          }
          if ! xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive_path" \
            -derivedDataPath "$RUNNER_TEMP/packlab-capture-archive-derived-data" \
            > "$signing_dir/archive.log" 2>&1; then
            report_failure archive "$signing_dir/archive.log"
            exit 1
          fi
          if ! xcodebuild -exportArchive \
            -archivePath "$archive_path" \
            -exportPath "$export_path" \
            -exportOptionsPlist "$signing_dir/ExportOptions.plist" \
            > "$signing_dir/export.log" 2>&1; then
            report_failure export "$signing_dir/export.log"
            exit 1
          fi
          test -s "$export_path/PackLabCapture.ipa"
          echo '- Signed archive and export: PASS (logs kept on runner only)' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify exported IPA signature and identity
        if: ${{ steps.signing-inputs.outputs.configured == 'true' }}
        run: |
          set -euo pipefail
          ipa="$RUNNER_TEMP/packlab-signed-export/PackLabCapture.ipa"
          verify_dir="$RUNNER_TEMP/packlab-signed-verify"
          rm -rf "$verify_dir"
          mkdir -p "$verify_dir"
          unzip -q "$ipa" -d "$verify_dir"
          app_path="$verify_dir/Payload/PackLabCapture.app"
          test -s "$app_path/embedded.mobileprovision"
          test -d "$app_path/_CodeSignature"
          /usr/bin/codesign --verify --deep --strict "$app_path" > /dev/null 2>&1
          python3 - "$app_path/Info.plist" <<'PY'
          import plistlib
          import sys
          from pathlib import Path

          info = plistlib.loads(Path(sys.argv[1]).read_bytes())
          expected = {
              'CFBundleIdentifier': 'com.packlab.capture',
              'CFBundleShortVersionString': '0.1.0',
              'CFBundleVersion': '1',
              'DTPlatformName': 'iphoneos',
          }
          for key, value in expected.items():
              if info.get(key) != value:
                  raise SystemExit(f'{key} mismatch: expected {value!r}; got {info.get(key)!r}.')
          print('Signed IPA bundle identity and Capture version/build validated.')
          PY
          rm -rf "$verify_dir"
          echo "- Signed IPA SHA-256: $(shasum -a 256 "$ipa" | awk '{ print $1 }')" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '- Signing state: SIGNED (codesign --verify --deep --strict PASS)' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Delete temporary keychain once signing is verified
        if: ${{ steps.signing-inputs.outputs.configured == 'true' }}
        run: |
          set -euo pipefail
          signing_dir="$RUNNER_TEMP/packlab-signing"
          profile_uuid="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["profile_uuid"])' "$signing_dir/signing.json")"
          security delete-keychain "$signing_dir/packlab-signing.keychain-db"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision" \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$profile_uuid.mobileprovision" \
            "$signing_dir/profile.mobileprovision" "$signing_dir/profile.plist"

      - name: Prepare signed IPA provenance sidecar
        if: ${{ steps.signing-inputs.outputs.configured == 'true' }}
        env:
          PACKLAB_ARTIFACT_TYPE: ios_signed_ipa
          PACKLAB_SIGNING_STATE: SIGNED
          PACKLAB_PRODUCT_NAME: PackLabCapture.ipa
          PACKLAB_CAPTURE_VERSION: 0.1.0
          PACKLAB_CAPTURE_BUILD: '1'
          PACKLAB_PACKSCAN_SCHEMA_VERSION: 1.0.0
          PACKLAB_XCODE_VERSION: ${{ steps.archive-xcode.outputs.version }}
          PACKLAB_XCODE_BUILD: ${{ steps.archive-xcode.outputs.build }}
          PACKLAB_SDK_NAME: iphoneos
          PACKLAB_SDK_VERSION: ${{ steps.archive-xcode.outputs.ios_sdk }}
          PACKLAB_BUNDLE_IDENTIFIER: com.packlab.capture
        run: |
          set -euo pipefail
          # Plain SHA-256 of Package.resolved; hashFiles() would hash the file's hash.
          PACKLAB_PACKAGE_RESOLVED_SHA256="$(shasum -a 256 'apps/ios-capture/PackLabCapture.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved' | awk '{ print $1 }')"
          export PACKLAB_PACKAGE_RESOLVED_SHA256
          python3 tools/ci/ios_artifact_provenance.py prepare \
            --artifact "$RUNNER_TEMP/packlab-signed-export/PackLabCapture.ipa" \
            --sidecar "$RUNNER_TEMP/packlab-capture-signed-ipa-provenance.json"
          python3 tools/ci/ios_artifact_provenance.py verify \
            --artifact "$RUNNER_TEMP/packlab-signed-export/PackLabCapture.ipa" \
            --sidecar "$RUNNER_TEMP/packlab-capture-signed-ipa-provenance.json"

      - name: Preserve signed IPA provenance sidecar for one day
        if: ${{ steps.signing-inputs.outputs.configured == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: packlab-capture-signed-ipa-provenance-${{ github.sha }}
          path: ${{ runner.temp }}/packlab-capture-signed-ipa-provenance.json
          if-no-files-found: error
          retention-days: 1

      - name: Preserve signed IPA for one day (owner opt-in)
        if: ${{ steps.signing-inputs.outputs.configured == 'true' && inputs.upload_signed_ipa }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: packlab-capture-signed-ipa-${{ github.sha }}
          path: ${{ runner.temp }}/packlab-signed-export/PackLabCapture.ipa
          if-no-files-found: error
          retention-days: 1

      - name: Delete temporary keychain and signing material
        if: ${{ always() }}
        run: |
          set -uo pipefail
          signing_dir="$RUNNER_TEMP/packlab-signing"
          keychain="$signing_dir/packlab-signing.keychain-db"
          if [[ -f "$signing_dir/signing.json" ]]; then
            profile_uuid="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["profile_uuid"])' "$signing_dir/signing.json" 2> /dev/null || true)"
            if [[ -n "$profile_uuid" ]]; then
              rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision" \
                "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$profile_uuid.mobileprovision"
            fi
          fi
          if [[ -e "$keychain" ]]; then
            security delete-keychain "$keychain" > /dev/null 2>&1 || true
          fi
          rm -rf "$signing_dir" "$RUNNER_TEMP/packlab-signed-verify" "$RUNNER_TEMP/PackLabCapture-signed.xcarchive" \
            "$RUNNER_TEMP/packlab-signed-export" "$RUNNER_TEMP/packlab-capture-archive-derived-data"
          if [[ -e "$signing_dir" || -e "$keychain" ]]; then
            echo 'Temporary signing material could not be removed.' >&2
            exit 1
          fi
          echo 'Temporary signing keychain, profile and certificate material removed.'
