[build-system]
requires = ["setuptools>=75,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "packlab"
version = "0.1.0"
description = "PackLab packaging digital-twin foundation"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.3,<9",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["core/src", "apps/windows-studio/src"]
include = ["packlab_core*", "packlab_studio*"]
namespaces = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["core/src", "apps/windows-studio/src", "tools", "tests"]
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
files = ["core/src", "apps/windows-studio/src", "tools"]
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
